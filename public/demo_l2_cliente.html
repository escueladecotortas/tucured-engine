                <div id="step-2-error-${wId}" class="text-xs text-rose-400 font-medium hidden"></div>
                <div class="flex gap-2.5 pt-2 mt-6"><button id="btn-back-2-${wId}" class="w-1/3 py-4 rounded-xl font-bold bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/50 transition-colors text-sm cursor-pointer">Volver</button><button id="btn-next-2-${wId}" class="w-2/3 py-4 rounded-xl font-bold bg-indigo-600 text-white hover:bg-indigo-500 transition-all shadow-lg shadow-indigo-600/20 text-sm cursor-pointer">Revisar</button></div>
              </div>
              <div id="step-3-${wId}" class="[grid-area:1/1] w-full min-w-0 box-border transition-all duration-500 ease-in-out opacity-0 pointer-events-none transform translate-x-full flex flex-col justify-between">

                </div>

                </div>
                <div id="wa-dispatch-status-${wId}" class="p-3 rounded-xl bg-indigo-950/40 border border-indigo-500/30 text-indigo-300 text-xs text-center flex items-center justify-center gap-2">

                </div>
                <div class="space-y-2 pt-1">

                  <a id="btn-fallback-wa-${wId}" href="#" target="_blank" class="w-full py-2.5 rounded-xl text-[11px] font-semibold bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-emerald-400 border border-zinc-800 transition-all flex items-center justify-center gap-1.5 hidden"><span>💬 Guardar comprobante en mi WhatsApp</span></a>

        const $ = (id) => document.getElementById(id + '-' + wId);
        const dom = {
          s1: $('step-1'), s2: $('step-2'), s3: $('step-3'), s4: $('step-4'),
          ind: $('step-indicator'), d1: $('step-dot-1'), d2: $('step-dot-2'), d3: $('step-dot-3'),
          b1: $('step-bar-1'), b2: $('step-bar-2'),
          sub: $('turnero-subtitle'), bizTitle: $('biz-title'),
          daySel: $('day-selector'), timeSel: $('time-selector'),
          dayPrev: $('day-prev'), dayNext: $('day-next'),
          btnNext1: $('btn-next-1'), btnNext2: $('btn-next-2'),
          btnBack2: $('btn-back-2'), btnBack3: $('btn-back-3'),
          btnConfirm: $('btn-confirm'), btnIcs: $('btn-ics'),
          inpFName: $('input-fname'), inpLName: $('input-lname'),
          inpPhone: $('input-phone'), inpPax: $('input-pax'), err2: $('step-2-error'),
          sumName: $('summary-name'), sumDay: $('summary-day'), sumTime: $('summary-time'), sumPax: $('summary-pax'),

        };

        const state = { step: 1, dayOffset: 0, day: null, dateObj: null, time: null, fname: '', lname: '', phone: '', pax: '2', isToday: false, activeDayData: null, hash: '' };
        const toTitleCase = (s) => (s || '').trim().toLowerCase().replace(/(?:^|\s|-|')\S/g, c => c.toUpperCase());
        const sanitizePhone = (v) => v.replace(/\D/g, '').replace(/^549?/, '').replace(/^0/, '').replace(/^(\d{2,4})15/, '$1');
        const validateName = (v) => /^[a-zA-ZáéíóúÁÉÍÓÚñÑüÜ\s]{2,30}$/.test((v || '').trim());
        const hasBadWords = (s) => ["mierda","puto","puta","boludo","pelotudo","concha","hdp","spam","carajo","forro"].some(w => (s || "").toLowerCase().includes(w)) || /[<>{}\\/]/.test(s);
        const toIso = (d) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

        const fetchAvailability = async (iso) => {
          let bookings = [];
          try { bookings = JSON.parse(localStorage.getItem('tucu_l2_bookings') || '[]'); } catch(e) {}
          const occForDay = bookings.filter(b => b.date === iso && b.status === 'CONFIRMED').map(b => b.time);
          const merged = Array.from(new Set([...cfg.occupiedSlots, ...occForDay]));
          return new Promise(r => setTimeout(() => r({ occupied: merged }), 50));
        };

        const getAllDays = () => {
          const days = []; const names = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
          let cur = new Date(); let guard = 0; const todayStr = toIso(new Date());
          while (days.length < cfg.days && guard < 120) {
            guard++; const d = new Date(cur); const iso = toIso(d); const dow = d.getDay();
            const dayCfg = cfg.schedule ? cfg.schedule[dow] : null; const isWorkday = dayCfg ? !!dayCfg.enabled : (dow !== 0);
            const isHol = cfg.blockHolidays && HOLIDAYS.includes(iso);
            const isVacation = cfg.vacations && cfg.vacations.some(v => iso >= v.from && iso <= v.to);
            if (isWorkday && !isHol && !isVacation) {
              days.push({ isToday: iso === todayStr, label: iso === todayStr ? 'Hoy' : names[dow], date: d.getDate(), fullDate: d, iso, dayOfWeek: dow, fullStr: d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) });
            }
            cur.setDate(cur.getDate() + 1);
          }
          return days;
        };

        const allDays = getAllDays();
        const generateRange = (startStr, endStr, interval) => {
          const slots = []; let current = new Date(`2000-01-01T${startStr}:00`); const end = new Date(`2000-01-01T${endStr}:00`);
          while (current <= end) { slots.push(current.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })); current.setMinutes(current.getMinutes() + interval); }
          return slots;
        };

        const generateTimeSlots = (dayData) => {
          const dayCfg = cfg.schedule ? cfg.schedule[dayData.dayOfWeek] : null;
          if (!dayCfg || !dayCfg.enabled) return [];
          const s1 = generateRange(dayCfg.open, dayCfg.close, cfg.interval);
          return (!dayCfg.isSplit || !dayCfg.open2 || !dayCfg.close2) ? s1 : [...s1, ...generateRange(dayCfg.open2, dayCfg.close2, cfg.interval)];
        };

        const renderDays = () => {
          const visibleDays = allDays.slice(state.dayOffset, state.dayOffset + 4);
          dom.daySel.innerHTML = visibleDays.map((d, idx) => {
            const actualIdx = state.dayOffset + idx; const isSelected = state.day === d.fullStr;
            return `<button data-idx="${actualIdx}" class="day-btn py-2.5 px-1 flex flex-col items-center justify-center border rounded-2xl transition-all text-center cursor-pointer select-none ${isSelected ? "bg-indigo-600 text-white border-indigo-500 shadow-lg shadow-indigo-600/30 font-bold" : "bg-zinc-800/70 hover:bg-zinc-800 text-zinc-300 border-zinc-700/60"}"><span class="text-[10px] sm:text-[11px] font-medium opacity-80 uppercase tracking-wider">${d.label}</span><span class="font-bold text-base sm:text-lg leading-tight mt-0.5">${d.date}</span></button>`;
          }).join('');
          if (dom.dayPrev) dom.dayPrev.disabled = state.dayOffset === 0;
          if (dom.dayNext) dom.dayNext.disabled = state.dayOffset + 4 >= allDays.length;
          dom.daySel.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
              const dayData = allDays[parseInt(e.currentTarget.dataset.idx, 10)];
              state.day = dayData.fullStr; state.dateObj = dayData.fullDate; state.isToday = dayData.isToday; state.time = null; state.activeDayData = dayData;
              if (dom.btnNext1) dom.btnNext1.disabled = true;
              renderDays(); renderTimes(dayData);
            });
          });
        };

        const renderTimes = async (dayData) => {
          dom.timeSel.innerHTML = `<div class="col-span-full py-4 text-center text-xs text-indigo-400 animate-pulse">Consultando disponibilidad L2...</div>`;
          const avail = await fetchAvailability(dayData.iso);
          const slots = generateTimeSlots(dayData); const now = new Date(); const curMins = now.getHours() * 60 + now.getMinutes();
          dom.timeSel.innerHTML = slots.map(t => {
            const [h, m] = t.split(':').map(Number); const slotMins = h * 60 + m;
            const isPast = state.isToday && slotMins <= curMins;
            const isOcc = avail.occupied && avail.occupied.includes(t);
            const isSel = state.time === t;
            if (isPast || isOcc) return `<button disabled class="opacity-25 bg-zinc-900 border-zinc-800/60 text-zinc-600 line-through cursor-not-allowed py-2.5 px-2 text-xs font-medium rounded-xl select-none">${t}</button>`;
            return `<button data-time="${t}" class="time-btn py-2.5 px-2 text-xs font-semibold rounded-xl border transition-all select-none cursor-pointer ${isSel ? "bg-indigo-600 text-white border-indigo-500 shadow-md shadow-indigo-600/30 font-bold" : "bg-zinc-800/60 hover:bg-zinc-700 text-zinc-200 border-zinc-700/60"}">${t}</button>`;
          }).join('');
          dom.timeSel.querySelectorAll('.time-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', (e) => {
              state.time = e.currentTarget.dataset.time;
              if (dom.btnNext1) dom.btnNext1.disabled = false;
              renderTimes(dayData);
            });
          });
        };

        const setStepUI = (step, subtitle) => {
          if (dom.sub) dom.sub.innerText = subtitle;
          if (step <= 3) {
            [dom.d1, dom.d2, dom.d3].forEach((d, idx) => {
              if (idx + 1 === step) d.className = 'w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center shadow-lg shadow-indigo-500/20';
              else if (idx + 1 < step) d.className = 'w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center';
              else d.className = 'w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 font-bold text-xs flex items-center justify-center';
            });
            if (dom.b1) dom.b1.className = step > 1 ? 'h-full bg-indigo-600 w-full transition-all duration-300' : 'h-full bg-indigo-600 w-0 transition-all duration-300';
            if (dom.b2) dom.b2.className = step > 2 ? 'h-full bg-indigo-600 w-full transition-all duration-300' : 'h-full bg-indigo-600 w-0 transition-all duration-300';
          }
        };

        const goStep = (step) => {
          [dom.s1, dom.s2, dom.s3, dom.s4].forEach(s => {
            if (s) { s.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto'); s.classList.add('opacity-0', 'pointer-events-none'); }
          });
          if (step === 1) {
            dom.s1.classList.remove('-translate-x-full'); dom.s1.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            setStepUI(1, 'Paso 1: Selecciona fecha y hora');
          } else if (step === 2) {
            dom.s2.classList.remove('translate-x-full', '-translate-x-full'); dom.s2.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            setStepUI(2, 'Paso 2: Tus datos de contacto');
          } else if (step === 3) {
            state.hash = "TK-" + Math.random().toString(36).substring(2, 6).toUpperCase();
            if (dom.sumName) dom.sumName.innerText = `${state.fname} ${state.lname}`.trim();
            if (dom.sumDay) dom.sumDay.innerText = state.day;
            if (dom.sumTime) dom.sumTime.innerText = state.time;
            if (dom.sumPax) dom.sumPax.innerText = `${state.pax} persona(s)`;
            dom.s3.classList.remove('translate-x-full'); dom.s3.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            setStepUI(3, 'Paso 3: Revisión de tu turno');
          } else if (step === 4) {
            if (dom.ind) dom.ind.classList.add('hidden');
            if (dom.succHash) dom.succHash.innerText = '#' + state.hash;
            if (dom.succDateTime) dom.succDateTime.innerText = `${state.day} a las ${state.time} hs`;
            if (dom.succBiz) dom.succBiz.innerText = cfg.bizName;
            if (dom.manageLink) dom.manageLink.href = `/gestion_turno.html?token=${state.hash}`;
            dom.s4.classList.remove('translate-x-full'); dom.s4.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            setStepUI(4, 'Reserva Completada');
          }
        };

        if (dom.btnNext1) dom.btnNext1.addEventListener('click', () => goStep(2));
        if (dom.btnBack2) dom.btnBack2.addEventListener('click', () => goStep(1));
        if (dom.btnNext2) dom.btnNext2.addEventListener('click', () => {
          const rawPhone = dom.inpPhone ? dom.inpPhone.value.trim() : '';
          const rawFName = dom.inpFName ? dom.inpFName.value.trim() : '';
          const rawLName = dom.inpLName ? dom.inpLName.value.trim() : '';
          state.pax = dom.inpPax ? dom.inpPax.value : '2';
          const cleanPhone = sanitizePhone(rawPhone);
          const fname = toTitleCase(rawFName);
          const lname = toTitleCase(rawLName);
          const showError = (msg) => { if (dom.err2) { dom.err2.innerText = msg; dom.err2.classList.remove('hidden'); } };

          if (!cleanPhone || cleanPhone.length < 8) return showError('Ingresa un número de WhatsApp válido.');
          const isBlacklisted = cfg.blacklist && cfg.blacklist.some(b => sanitizePhone(typeof b === 'object' ? b.phone : b) === cleanPhone);
          if (isBlacklisted) return showError('No es posible registrar turnos con esta línea telefónica. Contacte al comercio.');

          if (!validateName(fname)) return showError('Ingresa un Nombre válido (2-30 letras).');
          if (!validateName(lname)) return showError('Ingresa un Apellido válido (2-30 letras).');
          if (hasBadWords(fname) || hasBadWords(lname)) return showError('Nombre no permitido. Revisa tus datos.');

          if (dom.err2) dom.err2.classList.add('hidden');
          state.phone = cleanPhone; state.fname = fname; state.lname = lname;
          goStep(3);
        });

        if (dom.btnBack3) dom.btnBack3.addEventListener('click', () => goStep(2));
        if (dom.btnConfirm) dom.btnConfirm.addEventListener('click', async () => {
          const fullName = `${state.fname} ${state.lname}`.trim();
          const iso = state.activeDayData ? state.activeDayData.iso : toIso(new Date());
          const newBooking = {
            id: state.hash,
            date: iso,
            time: state.time,
            client: fullName,
            phone: state.phone,
            pax: state.pax,
            status: "CONFIRMED",
            createdAt: new Date().toISOString()
          };
          try {
            const bookings = JSON.parse(localStorage.getItem('tucu_l2_bookings') || '[]');
            bookings.push(newBooking);
            localStorage.setItem('tucu_l2_bookings', JSON.stringify(bookings));
          } catch(e) {}

          goStep(4);

          const manageUrl = `${window.location.origin}/gestion_turno.html?token=${state.hash}`;
          const text = cfg.template
            .replace(/\{\{id\}\}/g, state.hash)
            .replace(/\{\{personas\}\}/g, state.pax)
            .replace(/\{\{cliente\}\}/g, fullName)
            .replace(/\{\{fecha\}\}/g, state.day)
            .replace(/\{\{hora\}\}/g, state.time)
            .replace(/\{\{comercio\}\}/g, cfg.bizName)
            .replace(/\{\{telefono\}\}/g, state.phone)
            .replace(/\{\{link\}\}/g, manageUrl);

          if (dom.fallbackWa) {
            dom.fallbackWa.href = `https://wa.me/${cfg.waNumber.replace(/\D/g, '')}?text=${encodeURIComponent(text)}`;
          }

          try {
            const res = await fetch('/api/wa/send-test', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ phone: state.phone, message: text })
            });
            const data = await res.json();
            if (data.success) {
              if (dom.waStatus) {
                dom.waStatus.className = 'p-3 rounded-xl bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 text-xs text-center';
                dom.waStatus.innerText = '✅ Comprobante enviado automáticamente a tu WhatsApp';
              }
            } else {
              throw new Error(data.error || 'Offline');
            }
          } catch (err) {
            if (dom.waStatus) {
              dom.waStatus.className = 'p-3 rounded-xl bg-zinc-900 border border-zinc-800 text-zinc-300 text-xs text-center';
              dom.waStatus.innerText = 'ℹ️ Turno confirmado en web. Guarda tu comprobante:';
            }
            if (dom.fallbackWa) dom.fallbackWa.classList.remove('hidden');
          }
        });

        if (dom.btnIcs) dom.btnIcs.addEventListener('click', () => {
          const d = new Date(state.dateObj || new Date());
          const [h, m] = (state.time || '10:00').split(':').map(Number);
          d.setHours(h, m, 0);
          const endD = new Date(d);
          endD.setMinutes(endD.getMinutes() + 60);
          const fmt = (dt) => dt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
          const ics = [
            'BEGIN:VCALENDAR', 'VERSION:2.0', 'BEGIN:VEVENT',
            `DTSTART:${fmt(d)}`, `DTEND:${fmt(endD)}`,
            `SUMMARY:Cita en ${cfg.bizName}`,
            `DESCRIPTION:Reserva para ${state.fname} ${state.lname} (${state.pax} pax). ID: #${state.hash}`,
            'END:VEVENT', 'END:VCALENDAR'
          ].join('\r\n');
          const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `reserva_${cfg.bizName.replace(/\s+/g, '_')}.ics`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });

        if (dom.dayPrev) dom.dayPrev.addEventListener('click', () => { if (state.dayOffset > 0) { state.dayOffset -= 4; renderDays(); } });
        if (dom.dayNext) dom.dayNext.addEventListener('click', () => { if (state.dayOffset + 4 < allDays.length) { state.dayOffset += 4; renderDays(); } });

        renderDays();
        if (allDays.length > 0) {
          state.day = allDays[0].fullStr; state.dateObj = allDays[0].fullDate;
          state.isToday = allDays[0].isToday; state.activeDayData = allDays[0];
          renderTimes(allDays[0]);
        }
      }

      window.addEventListener('DOMContentLoaded', renderTurnero);
      window.addEventListener('storage', renderTurnero);
    })();
  </script>
</body>
</html>
