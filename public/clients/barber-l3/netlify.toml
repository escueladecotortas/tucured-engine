# Archivo: netlify.toml

[build]
  command = "npm run build:prod"
  publish = "out"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[redirects]]
  from = "/admin"
  to = "/admin/turnos.html"
  status = 200

[[redirects]]
  from = "/admin/login"
  to = "/admin/login.html"
  status = 200

[[redirects]]
  from = "/admin/turnos"
  to = "/admin/turnos.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
