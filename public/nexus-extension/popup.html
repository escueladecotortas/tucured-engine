<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            font-family: 'Segoe UI', sans-serif;
            padding: 15px;
            background: #0f172a;
            color: white;
        }

        h1 {
            font-size: 16px;
            margin-top: 0;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #334155;
            border-color: #475569;
        }

        .btn.primary {
            background: #0ea5e9;
            border-color: #0284c7;
        }

        .btn.primary:hover {
            background: #0284c7;
        }

        .status {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 10px;
            text-align: center;
        }

        .logo-icon {
            width: 20px;
            height: 20px;
            background: #0ea5e9;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <h1>Nexus Cyborg v1.0</h1>
    <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 15px;">
        Navega a un negocio o lista en Google Maps y extrae los datos directamente a Nexus.
    </p>

    <button id="scrape-detail" class="btn primary">📍 Importar Local Actual</button>
    <button id="scrape-list" class="btn">📜 Cosechar Lista (Visible)</button>

    <div id="status" class="status">Listo para operar</div>

    <script src="popup.js"></script>
</body>

</html>
