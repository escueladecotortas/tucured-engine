<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <defs>
    <linearGradient id="terracota" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D4C"/>
      <stop offset="100%" style="stop-color:#C54B3C"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D4A574"/>
      <stop offset="100%" style="stop-color:#C4956A"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E85D4C"/>
      <stop offset="100%" style="stop-color:#C54B3C"/>
    </linearGradient>
  </defs>
  
  <!-- Connection lines -->
  <g stroke="#C54B3C" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6">
    <path d="M 62 60 Q 80 60 100 60"/>
    <path d="M 138 60 Q 120 60 100 60"/>
    <path d="M 69 27 Q 85 45 100 60"/>
    <path d="M 131 27 Q 115 45 100 60"/>
    <path d="M 100 95 Q 100 77 100 60"/>
  </g>
  
  <!-- Nodes -->
  <!-- Center node (gold) -->
  <circle cx="100" cy="60" r="16" fill="url(#gold)"/>
  
  <!-- Outer nodes (terracota) -->
  <circle cx="50" cy="60" r="12" fill="url(#terracota)"/>
  <circle cx="150" cy="60" r="12" fill="url(#terracota)"/>
  <circle cx="60" cy="18" r="9" fill="url(#terracota)"/>
  <circle cx="140" cy="18" r="9" fill="url(#terracota)"/>
  <circle cx="100" cy="105" r="10" fill="url(#terracota)"/>
  
  <!-- Text -->
  <text x="100" y="145" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="28" font-weight="600" fill="url(#textGrad)">TucuRed</text>
  
  <!-- Tagline -->
  <text x="100" y="165" text-anchor="middle" font-family="Outfit, Arial, sans-serif" font-size="8" fill="#888" letter-spacing="2">CONECTAMOS TU NEGOCIO</text>
</svg>
