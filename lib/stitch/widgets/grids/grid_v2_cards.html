<!-- WIDGET: Grid_Cards_Icon -->
<!-- VIBE: Professional, Clean, Trustworthy -->
<section class="py-24 bg-white">
    <div class="container mx-auto px-6">
        <div class="text-center max-w-3xl mx-auto mb-16">
            <span class="text-[var(--primary)] font-bold tracking-wider uppercase text-sm">{{SECTION_LABEL}}</span>
            <h2 class="text-4xl font-bold mt-3 mb-6">{{GRID_TITLE}}</h2>
            <p class="text-gray-500 text-lg">{{GRID_SUBTITLE}}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <!-- Card 1 -->
            <div class="p-8 rounded-2xl bg-gray-50 border border-gray-100 hover:border-[var(--primary)] hover:shadow-xl transition-all duration-300 group">
                <div class="w-14 h-14 bg-white rounded-xl shadow-sm flex items-center justify-center text-[var(--primary)] mb-6 group-hover:scale-110 transition-transform">
                    {{ICON_1}}
                </div>
                <h3 class="text-xl font-bold mb-3 group-hover:text-[var(--primary)] transition-colors">{{CARD_1_TITLE}}</h3>
                <p class="text-gray-500 leading-relaxed">{{CARD_1_DESC}}</p>
            </div>

            <!-- Card 2 -->
             <div class="p-8 rounded-2xl bg-gray-50 border border-gray-100 hover:border-[var(--primary)] hover:shadow-xl transition-all duration-300 group">
                <div class="w-14 h-14 bg-white rounded-xl shadow-sm flex items-center justify-center text-[var(--primary)] mb-6 group-hover:scale-110 transition-transform">
                    {{ICON_2}}
                </div>
                <h3 class="text-xl font-bold mb-3 group-hover:text-[var(--primary)] transition-colors">{{CARD_2_TITLE}}</h3>
                <p class="text-gray-500 leading-relaxed">{{CARD_2_DESC}}</p>
            </div>

            <!-- Card 3 -->
             <div class="p-8 rounded-2xl bg-gray-50 border border-gray-100 hover:border-[var(--primary)] hover:shadow-xl transition-all duration-300 group">
                <div class="w-14 h-14 bg-white rounded-xl shadow-sm flex items-center justify-center text-[var(--primary)] mb-6 group-hover:scale-110 transition-transform">
                    {{ICON_3}}
                </div>
                <h3 class="text-xl font-bold mb-3 group-hover:text-[var(--primary)] transition-colors">{{CARD_3_TITLE}}</h3>
                <p class="text-gray-500 leading-relaxed">{{CARD_3_DESC}}</p>
            </div>
        </div>
    </div>
</section>
