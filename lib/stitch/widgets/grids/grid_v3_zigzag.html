<!-- WIDGET: Grid_ZigZag -->
<!-- VIBE: Editorial, Storytelling, Engaging -->
<section class="py-24 overflow-hidden">
    <div class="container mx-auto px-6 space-y-24">
        
        <!-- Row 1: Text Left, Image Right -->
        <div class="flex flex-col md:flex-row items-center gap-12">
            <div class="flex-1 space-y-6">
                <div class="w-12 h-1 bg-[var(--secondary)]"></div>
                <h2 class="text-4xl font-bold text-gray-900">{{ROW_1_TITLE}}</h2>
                <p class="text-lg text-gray-600 leading-relaxed">{{ROW_1_DESC}}</p>
                <ul class="space-y-3 pt-4">
                    <li class="flex items-center gap-3 text-gray-700">
                        <span class="text-green-500">✓</span> {{ROW_1_POINT_1}}
                    </li>
                    <li class="flex items-center gap-3 text-gray-700">
                        <span class="text-green-500">✓</span> {{ROW_1_POINT_2}}
                    </li>
                </ul>
            </div>
            <div class="flex-1 relative">
                <div class="absolute inset-0 bg-[var(--primary)]/10 rounded-full blur-3xl transform translate-x-12 translate-y-12"></div>
                <img src="{{ROW_1_IMG}}" class="relative rounded-2xl shadow-2xl z-10 w-full hover:-translate-y-2 transition-transform duration-500">
            </div>
        </div>

        <!-- Row 2: Image Left, Text Right -->
        <div class="flex flex-col md:flex-row-reverse items-center gap-12">
            <div class="flex-1 space-y-6">
                <div class="w-12 h-1 bg-[var(--secondary)]"></div>
                <h2 class="text-4xl font-bold text-gray-900">{{ROW_2_TITLE}}</h2>
                <p class="text-lg text-gray-600 leading-relaxed">{{ROW_2_DESC}}</p>
                <button class="px-8 py-3 border-2 border-[var(--primary)] text-[var(--primary)] font-bold rounded-full hover:bg-[var(--primary)] hover:text-white transition-all">
                    {{ROW_2_CTA}}
                </button>
            </div>
            <div class="flex-1 relative">
                 <div class="absolute inset-0 bg-[var(--secondary)]/10 rounded-full blur-3xl transform -translate-x-12 -translate-y-12"></div>
                <img src="{{ROW_2_IMG}}" class="relative rounded-2xl shadow-2xl z-10 w-full hover:-translate-y-2 transition-transform duration-500">
            </div>
        </div>

    </div>
</section>
