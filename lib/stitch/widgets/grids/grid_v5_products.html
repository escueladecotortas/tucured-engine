<!-- WIDGET: Grid_Shop_Products -->
<!-- VIBE: E-commerce, Clean, Conversion-Focused -->
<section class="py-20 bg-gray-50">
    <div class="container mx-auto px-4">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-bold text-gray-900 mb-4">{{SHOP_TITLE}}</h2>
            <p class="text-gray-500 max-w-2xl mx-auto">{{SHOP_SUBTITLE}}</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
            <!-- Product 1 -->
            <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow overflow-hidden group">
                <div class="relative aspect-square overflow-hidden bg-gray-100">
                    <img src="{{PROD_1_IMG}}" class="object-cover w-full h-full group-hover:scale-110 transition-transform duration-500">
                    <span class="absolute top-3 right-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded">OFERTA</span>
                </div>
                <div class="p-6">
                    <h3 class="font-bold text-lg mb-1">{{PROD_1_NAME}}</h3>
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-2xl font-bold text-[var(--primary)]">${{PROD_1_PRICE}}</span>
                        <span class="text-sm text-gray-400 line-through">${{PROD_1_OLD_PRICE}}</span>
                    </div>
                    <button 
                        class="w-full bg-gray-900 text-white font-bold py-3 rounded-xl hover:bg-[var(--primary)] transition-colors flex items-center justify-center gap-2 add-to-cart-btn"
                        data-id="p1"
                        data-name="{{PROD_1_NAME}}"
                        data-price="{{PROD_1_PRICE}}"
                        onclick="addToCart(this)"
                    >
                        <span>🛒</span> Agregar
                    </button>
                </div>
            </div>

            <!-- Product 2 -->
             <div class="bg-white rounded-2xl shadow-sm hover:shadow-xl transition-shadow overflow-hidden group">

                </div>
