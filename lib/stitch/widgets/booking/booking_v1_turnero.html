<!-- WIDGET: Booking_WhatsApp_Turnero -->
<!-- VIBE: Functional, Service-Oriented, Conversion -->
<section class="py-20 bg-[var(--primary)] text-white text-center">
    <div class="container mx-auto px-4">
        <h2 class="text-3xl md:text-5xl font-bold mb-6">{{BOOKING_TITLE}}</h2>
        <p class="text-xl opacity-90 mb-10 max-w-2xl mx-auto">{{BOOKING_desc}}</p>
        
        <button onclick="openTurnero()" class="bg-white text-[var(--primary)] font-bold py-4 px-10 rounded-full shadow-lg hover:scale-105 transition-transform text-lg flex items-center justify-center gap-3 mx-auto">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            {{BOOKING_CTA}}
        </button>
    </div>
</section>

<!-- TURNERO MODAL (Hidden by default) -->
<div id="turneroModal" class="fixed inset-0 z-50 hidden flex items-center justify-center">
    <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="closeTurnero()"></div>
    <div class="relative bg-white text-gray-800 rounded-2xl w-[90%] max-w-md p-6 max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-200">
        <button class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl" onclick="closeTurnero()">✕</button>

        <div class="flex items-center gap-3 mb-6 text-[var(--primary)]">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <h3 class="font-bold text-lg">Reservar Turno</h3>
        </div>

        <!-- Step 1: Calendar -->
        <div id="turneroStep1" class="turnero-step block">
            <div class="flex justify-between items-center mb-4">
                <button onclick="prevMonth()" class="p-2 hover:bg-gray-100 rounded text-[var(--primary)]">◀</button>
                <span id="currentMonthYear" class="font-bold capitalize"></span>
                <button onclick="nextMonth()" class="p-2 hover:bg-gray-100 rounded text-[var(--primary)]">▶</button>
            </div>
            <div class="grid grid-cols-7 gap-1 mb-2 text-center text-xs text-gray-500 font-bold uppercase">
                <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
            </div>
            <div id="calendarGrid" class="grid grid-cols-7 gap-1"></div>
        </div>

        <!-- Step 2: Time -->
        <div id="turneroStep2" class="turnero-step hidden">
            <p class="text-center text-[var(--primary)] font-bold mb-4 capitalize" id="selectedDateDisplay"></p>
            <div id="timeSlots" class="grid grid-cols-3 gap-2 max-h-48 overflow-y-auto mb-4"></div>
            <button class="w-full py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50" onclick="goBack()">← Cambiar fecha</button>
        </div>

        <!-- Step 3: Confirm -->
        <div id="turneroStep3" class="turnero-step hidden space-y-4">
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100">
                <div class="flex justify-between mb-2">
                    <span class="text-gray-500">📅 Fecha</span>
                    <span class="font-bold" id="confirmDate"></span>
                </div>
                <div class="flex justify-between">
                    <span class="text-gray-500">🕐 Hora</span>
                    <span class="font-bold" id="confirmTime"></span>
                </div>
            </div>
            <input type="text" id="clientName" placeholder="Tu nombre (opcional)" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-[var(--primary)] outline-none">
            <button onclick="sendToWhatsApp()" class="w-full bg-[#25D366] text-white font-bold py-4 rounded-xl hover:bg-[#20bd5a] flex items-center justify-center gap-2 shadow-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                </svg>
                Confirmar por WhatsApp
            </button>
            <button class="w-full py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50" onclick="goBackToTime()">← Cambiar hora</button>
        </div>
    </div>
</div>

<script>
    // Config
    const PHONE_NUMBER = "{{WHATSAPP_NUMBER}}";
    
    // Logic
    const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const WORK_DAYS = [1, 2, 3, 4, 5, 6]; 
    const START_HOUR = 10;
    const END_HOUR = 20;

    let currentMonth = new Date();
    let selectedDate = null;
    let selectedTime = null;

    function openTurnero() {
        document.getElementById('turneroModal').classList.remove('hidden');
        document.getElementById('turneroModal').classList.add('flex');
        renderCalendar();
    }

    function closeTurnero() {
        document.getElementById('turneroModal').classList.add('hidden');
        document.getElementById('turneroModal').classList.remove('flex');
        showStep(1);
        selectedDate = null;
        selectedTime = null;
    }

    function showStep(n) {
        document.querySelectorAll('.turnero-step').forEach(s => s.classList.add('hidden'));
        document.getElementById('turneroStep' + n).classList.remove('hidden');
        document.getElementById('turneroStep' + n).classList.add('block');
    }

    function renderCalendar() {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const today = new Date();
        today.setHours(0,0,0,0);

        document.getElementById('currentMonthYear').textContent = MONTHS[month] + ' ' + year;

        let html = '';
        for (let i = 0; i < firstDay.getDay(); i++) {
            html += `<button class="aspect-square opacity-0 cursor-default"></button>`;
        }

        for (let day = 1; day <= lastDay.getDate(); day++) {
            const d = new Date(year, month, day);
            const isPast = d < today;
            const isWorkDay = WORK_DAYS.includes(d.getDay());
            const isToday = d.toDateString() === today.toDateString();
            
            let classes = "aspect-square rounded-lg text-sm font-medium transition-colors ";
            let attrs = "";
            
            if (isToday) classes += "ring-2 ring-[var(--primary)] ";
            
            if (!isPast && isWorkDay) {
                classes += "hover:bg-[var(--primary)] hover:text-white bg-gray-100 text-gray-800 cursor-pointer";
                attrs = `onclick="selectDate(${year}, ${month}, ${day})"`;
            } else {
                classes += "text-gray-300 cursor-not-allowed";
                attrs = "disabled";
            }

            html += `<button class="${classes}" ${attrs}>${day}</button>`;
        }
        document.getElementById('calendarGrid').innerHTML = html;
    }

    function prevMonth() {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
        renderCalendar();
    }
    function nextMonth() {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
        renderCalendar();
    }

    function selectDate(year, month, day) {
        selectedDate = new Date(year, month, day);
        document.getElementById('selectedDateDisplay').textContent = selectedDate.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        renderTimeSlots();
        showStep(2);
    }

    function renderTimeSlots() {
        let html = '';
        for (let h = START_HOUR; h < END_HOUR; h++) {
            const time = h.toString().padStart(2, '0') + ':00';
            html += `<button class="p-3 bg-gray-100 rounded-lg hover:bg-[var(--primary)] hover:text-white transition-colors" onclick="selectTime('${time}')">${time}</button>`;
        }
        document.getElementById('timeSlots').innerHTML = html;
    }

    function selectTime(time) {
        selectedTime = time;
        document.getElementById('confirmDate').textContent = selectedDate.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
        document.getElementById('confirmTime').textContent = time + ' hs';
        showStep(3);
    }

    function goBack() { showStep(1); }
    function goBackToTime() { showStep(2); }

    function sendToWhatsApp() {
        if (!selectedDate || !selectedTime) return;
        const name = document.getElementById('clientName').value || 'Cliente';
        const message = `Hola! Quiero reservar turno para el ${selectedDate.toLocaleDateString('es-AR')} a las ${selectedTime} hs. Soy ${name}.`;
        const waUrl = `https://wa.me/${PHONE_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
        closeTurnero();
    }
</script>
