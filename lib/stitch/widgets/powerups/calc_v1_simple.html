<!-- POWER-UP: Calculator_Budget_Simple -->
<!-- VIBE: Functional, Service, Lead Gen -->
<section class="py-16 bg-[var(--primary)]/5">
    <div class="container mx-auto px-4 max-w-2xl">
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100">
            <div class="text-center mb-8">
                <span class="bg-[var(--primary)]/10 text-[var(--primary)] px-3 py-1 rounded-full text-xs font-bold uppercase tracking-wide">Cotizador Online</span>
                <h2 class="text-2xl font-bold mt-3 text-gray-800">{{CALC_TITLE}}</h2>
                <p class="text-gray-500 text-sm">{{CALC_DESC}}</p>
            </div>

            <div class="space-y-6">
                <!-- Input Unit: e.g., m2 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">{{CALC_INPUT_LABEL}}</label>
                    <div class="flex items-center">
                        <input type="number" id="calcInput" class="w-full p-4 border border-gray-200 rounded-l-xl focus:ring-2 focus:ring-[var(--primary)] outline-none text-lg" placeholder="10">
                        <span class="bg-gray-100 p-4 border border-gray-200 border-l-0 rounded-r-xl text-gray-500 font-bold">{{CALC_UNIT}}</span>
                    </div>
                </div>

                <!-- Estimated Price Display -->
                <div class="bg-[var(--primary)]/5 p-6 rounded-xl text-center border border-[var(--primary)]/20">
                    <p class="text-gray-500 text-xs uppercase font-bold mb-1">Presupuesto Estimado</p>
                    <p class="text-4xl font-black text-[var(--primary)]" id="calcResult">$0</p>
                    <p class="text-xs text-gray-400 mt-2">*Precio referencial, sujeto a visita técnica.</p>
                </div>

                <!-- CTA -->
                <button onclick="sendQuote()" class="w-full bg-gray-900 text-white font-bold py-4 rounded-xl hover:bg-black transition-colors flex items-center justify-center gap-2 shadow-lg">
                    Contratar Ahora
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
                </button>
            </div>
        </div>
    </div>
</section>

<script>
    // CONFIG
    const UNIT_PRICE = {{CALC_UNIT_PRICE}};
    const SERVICE_NAME = "{{CALC_SERVICE_NAME}}";
    const WA_NUMBER_CALC = "{{WHATSAPP_NUMBER}}";

    const input = document.getElementById('calcInput');
    const resultDisplay = document.getElementById('calcResult');

    input.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value) || 0;
        const total = val * UNIT_PRICE;
        resultDisplay.innerText = '$' + total.toLocaleString();
    });

    function sendQuote() {
        const val = parseFloat(input.value) || 0;
        if(val <= 0) {
            alert("Por favor ingresa una cantidad válida.");
            return;
        }
        const total = val * UNIT_PRICE;
        
        const message = `Hola! Hice una cotización en la web.\n\n🛠️ *Servicio:* ${SERVICE_NAME}\n📏 *Cantidad:* ${val} {{CALC_UNIT}}\n💰 *Estimado:* $${total.toLocaleString()}\n\nQuisiera coordinar una visita.`;
        
        const url = `https://wa.me/${WA_NUMBER_CALC}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>
