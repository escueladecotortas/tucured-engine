<!-- POWER-UP: Cart_WhatsApp_Lite -->
<!-- VIBE: Floating, Utility, Persistent -->

<!-- Floating Cart Button -->
<div id="cartFab" class="fixed bottom-6 right-6 z-40 hidden">
    <button onclick="toggleCart()" class="relative bg-[var(--primary)] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform border-4 border-white">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs font-bold w-6 h-6 rounded-full flex items-center justify-center border-2 border-white animate-bounce">0</span>
    </button>
</div>

<!-- Cart Sidebar/Modal -->
<div id="cartModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
    <div class="absolute top-0 right-0 h-full w-full max-w-sm bg-white shadow-2xl transform transition-transform duration-300 translate-x-full" id="cartPanel">
        <div class="flex flex-col h-full">
            <!-- Header -->
            <div class="p-6 bg-gray-50 border-b border-gray-100 flex justify-between items-center">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <span>🛒</span> Tu Pedido
                </h3>
                <button onclick="toggleCart()" class="text-gray-400 hover:text-gray-600">✕ Cerrar</button>
            </div>

            <!-- Items List -->
            <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-4">
                <!-- Items will be injected here -->
                <p class="text-center text-gray-400 mt-10">Tu carrito está vacío.</p>
            </div>

            <!-- Footer / Checkout -->
            <div class="p-6 bg-gray-50 border-t border-gray-100 space-y-4">
                <div class="flex justify-between items-center text-lg font-bold">
                    <span>Total Estimado:</span>
                    <span id="cartTotal" class="text-[var(--primary)]">$0</span>
                </div>
                <div class="space-y-2">
                     <p class="text-xs text-gray-500">Completa tus datos para enviar el pedido:</p>
                     <input type="text" id="cartName" placeholder="Tu Nombre" class="w-full p-3 border rounded-lg text-sm">
                     <input type="text" id="cartAddress" placeholder="Dirección de envío (Opcional)" class="w-full p-3 border rounded-lg text-sm">
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-[#25D366] text-white font-bold py-4 rounded-xl hover:brightness-105 active:scale-95 transition-all flex items-center justify-center gap-2 shadow-lg">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
                    Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    // CART LOGIC
    const WA_NUMBER = "{{WHATSAPP_NUMBER}}";
    let cart = [];

    // Load from local storage if needed (Skipped for simplicity in v1)

    function addToCart(btn) {
        const product = {
            id: btn.dataset.id,
            name: btn.dataset.name,
            price: parseFloat(btn.dataset.price),
            qty: 1
        };

        const existing = cart.find(p => p.id === product.id);
        if (existing) {
            existing.qty++;
        } else {
            cart.push(product);
        }

        updateCartUI();
        
        // Visual feedback
        const originalText = btn.innerHTML;
        btn.innerHTML = "✅ Agregado";
        btn.classList.add("bg-green-600");
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.classList.remove("bg-green-600");
        }, 1500);

        // Auto open cart on first add? Maybe intrusive. Let's just animate the fab.
        const fab = document.getElementById('cartFab');
        fab.classList.remove('hidden');
        fab.classList.add('animate-bounce');
        setTimeout(() => fab.classList.remove('animate-bounce'), 1000);
    }

    function removeFromCart(id) {
        cart = cart.filter(p => p.id !== id);
        updateCartUI();
    }

    function updateCartUI() {
        // Update Count
        const totalQty = cart.reduce((sum, p) => sum + p.qty, 0);
        document.getElementById('cartCount').textContent = totalQty;

        if (totalQty > 0) {
            document.getElementById('cartFab').classList.remove('hidden');
        } else {
            document.getElementById('cartFab').classList.add('hidden');
        }

        // Update List
        const list = document.getElementById('cartItems');
        if (cart.length === 0) {
            list.innerHTML = '<p class="text-center text-gray-400 mt-10">Tu carrito está vacío.</p>';
        } else {
            list.innerHTML = cart.map(p => `
                <div class="flex justify-between items-center bg-white p-3 rounded-lg border border-gray-100 shadow-sm">
                    <div>
                        <h4 class="font-bold text-sm text-gray-800">${p.name}</h4>
                        <p class="text-xs text-gray-500">$${p.price} x ${p.qty}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-bold text-[var(--primary)]">$${p.price * p.qty}</span>
                        <button onclick="removeFromCart('${p.id}')" class="text-red-400 hover:text-red-600">✕</button>
                    </div>
                </div>
            `).join('');
        }

        // Update Total
        const total = cart.reduce((sum, p) => sum + (p.price * p.qty), 0);
        document.getElementById('cartTotal').textContent = '$' + total.toLocaleString();
    }

    function toggleCart() {
        const modal = document.getElementById('cartModal');
        const panel = document.getElementById('cartPanel');
        
        if (modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            setTimeout(() => {
                panel.classList.remove('translate-x-full');
            }, 10);
        } else {
            panel.classList.add('translate-x-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    }

    function checkoutWhatsApp() {
        if (cart.length === 0) return;
        
        const name = document.getElementById('cartName').value || 'Cliente';
        const address = document.getElementById('cartAddress').value || '';
        
        let message = `Hola! Soy ${name}. Quiero hacer el siguiente pedido:\n\n`;
        
        cart.forEach(p => {
            message += `▪️ ${p.qty}x ${p.name} ($${p.price * p.qty})\n`;
        });
        
        const total = cart.reduce((sum, p) => sum + (p.price * p.qty), 0);
        message += `\n💰 *TOTAL ESTIMADO: $${total.toLocaleString()}*`;
        
        if (address) message += `\n📍 Envío a: ${address}`;
        
        const url = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`;
        window.open(url, '_blank');
    }
</script>
