<!-- WIDGET: Hero_Lead_Magnet -->
<!-- VIBE: Direct, Service-Oriented, Trustworthy -->
<section class="relative min-h-[80vh] flex items-center bg-cover bg-center" style="background-image: url('{{HERO_BG_IMAGE}}')">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-gray-900/70 backdrop-blur-sm"></div>

    <div class="container mx-auto px-4 relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-12">
        <!-- Left: Value Proposition -->
        <div class="text-white flex flex-col justify-center">
            <div class="flex items-center gap-2 mb-4">
                <span class="text-yellow-400 text-2xl">★★★★★</span>
                <span class="text-sm font-medium opacity-80">{{RATING_TEXT}}</span>
            </div>
            <h1 class="text-4xl md:text-6xl font-bold mb-6 leading-tight">
                {{HERO_TITLE}}
            </h1>
            <ul class="space-y-4 mb-8 text-lg opacity-90">
                <li class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    {{BENEFIT_1}}
                </li>
                <li class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    {{BENEFIT_2}}
                </li>
                <li class="flex items-center gap-3">
                    <svg class="w-6 h-6 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    {{BENEFIT_3}}
                </li>
            </ul>
        </div>

        <!-- Right: The Form Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md mx-auto w-full border-t-8 border-(--primary)">
            <h3 class="text-2xl font-bold text-gray-800 mb-2 text-center">{{FORM_TITLE}}</h3>
            <p class="text-gray-500 text-center mb-6 text-sm">{{FORM_SUBTITLE}}</p>

            <form class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">Tu Nombre</label>
                    <input type="text" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-(--primary) focus:ring-2 focus:ring-(--primary)/20 outline-none transition-all" placeholder="Ej: Juan Pérez">
                </div>
                <div>
                    <label class="block text-xs font-bold text-gray-700 uppercase mb-1">WhatsApp / Tel</label>
                    <input type="tel" class="w-full px-4 py-3 rounded-lg bg-gray-50 border border-gray-200 focus:border-(--primary) focus:ring-2 focus:ring-(--primary)/20 outline-none transition-all" placeholder="+54 381 ...">
                </div>
                <button type="button" class="w-full bg-(--primary) text-white font-bold py-4 rounded-lg hover:brightness-110 active:scale-95 transition-all shadow-lg hover:shadow-xl">
                    {{FORM_CTA}}
                </button>
                <p class="text-xs text-center text-gray-400 mt-4">
                    🔒 Tus datos están seguros con nosotros.
                </p>
            </form>
        </div>
    </div>
</section>
