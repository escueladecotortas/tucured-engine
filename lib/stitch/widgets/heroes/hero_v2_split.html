<!-- WIDGET: Hero_Split_Modern -->
<!-- VIBE: Professional, Clean, Structured but Organic -->
<section class="relative min-h-[90vh] bg-gradient-to-br from-gray-50 to-gray-200 flex items-center overflow-hidden">
    <!-- Decorative Blob -->
    <div class="absolute top-0 right-0 w-[800px] h-[800px] bg-[var(--secondary)]/10 rounded-full blur-3xl -translate-y-1/2 translate-x-1/3"></div>

    <div class="container mx-auto px-6 relative z-10 grid grid-cols-1 lg:grid-cols-2 gap-12 items-center">
        <!-- Text Column -->
        <div class="text-left order-2 lg:order-1">
            <h1 class="text-6xl font-extrabold text-[var(--primary)] mb-6 leading-tigher font-[family-name:var(--font-head)]">
                {{HERO_TITLE_LINE1}} <br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-[var(--primary)] to-[var(--secondary)]">
                    {{HERO_TITLE_LINE2}}
                </span>
            </h1>
            <p class="text-lg text-gray-600 mb-8 max-w-lg leading-relaxed">
                {{HERO_SUBTITLE}}
            </p>
            
            <div class="flex items-center gap-4">
                <a href="{{CTA_LINK}}" class="px-8 py-4 bg-[var(--primary)] text-white rounded-tr-2xl rounded-bl-2xl hover:rounded-xl transition-all duration-300 shadow-lg hover:shadow-xl font-bold">
                    {{CTA_TEXT}}
                </a>
                <div class="flex items-center gap-2">
                    <div class="flex -space-x-2">
                        <!-- Social Proof Avatars -->
                        <img src="https://i.pravatar.cc/100?img=1" class="w-10 h-10 rounded-full border-2 border-white">
                        <img src="https://i.pravatar.cc/100?img=2" class="w-10 h-10 rounded-full border-2 border-white">
                        <img src="https://i.pravatar.cc/100?img=3" class="w-10 h-10 rounded-full border-2 border-white">
                    </div>
                    <span class="text-sm font-medium text-gray-500">{{TRUST_TEXT}}</span>
                </div>
            </div>
        </div>

        <!-- Image Column -->
        <div class="relative order-1 lg:order-2">
            <!-- Organic Mask Image -->
            <div class="relative w-full aspect-square rounded-[2rem] lg:rounded-tl-[10rem] lg:rounded-br-[5rem] overflow-hidden shadow-2xl rotate-2 hover:rotate-0 transition-all duration-500 ring-8 ring-white/50 backdrop-blur-xl">
                <img src="{{HERO_IMAGE}}" alt="Hero Image" class="w-full h-full object-cover">
            </div>
            <!-- Floating Data Card -->
            <div class="absolute -bottom-6 -left-6 bg-white/80 backdrop-blur-md p-4 rounded-xl shadow-lg border border-white/40 animate-bounce-slow">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-green-600">
                        MapIcon
                    </div>
                    <div>
                        <p class="text-xs text-gray-400 uppercase font-bold">Ubicación</p>
                        <p class="text-sm font-bold text-[var(--primary)]">{{LOCATION_TEXT}}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
