<!-- WIDGET: Hero_Video_Impact -->
<!-- VIBE: Cinematic, Immersive, High-End -->
<section class="relative h-screen w-full overflow-hidden flex items-center justify-center">
    <!-- Background Video -->
    <div class="absolute inset-0 z-0">
        <video autoplay loop muted playsinline class="w-full h-full object-cover">
            <source src="{{HERO_VIDEO_URL}}" type="video/mp4">
        </video>
        <!-- Nano Banana Gradient Overlay (No dark dimming, use color) -->
        <div class="absolute inset-0 bg-gradient-to-t from-[var(--primary)]/90 via-[var(--primary)]/40 to-transparent mix-blend-multiply"></div>
    </div>

    <!-- Content -->
    <div class="relative z-10 text-center px-4 max-w-5xl mx-auto">
        <span class="inline-block py-1 px-3 rounded-full bg-white/20 backdrop-blur-md border border-white/30 text-white text-sm font-medium mb-6 animate-fade-in-up">
            {{HERO_BADGE_TEXT}}
        </span>
        <h1 class="text-5xl md:text-7xl font-bold text-white mb-6 leading-tight drop-shadow-lg font-[family-name:var(--font-head)]">
            {{HERO_TITLE}}
        </h1>
        <p class="text-xl md:text-2xl text-white/90 mb-10 max-w-2xl mx-auto font-light">
            {{HERO_SUBTITLE}}
        </p>
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{{CTA_LINK}}" class="px-8 py-4 bg-white text-[var(--primary)] font-bold rounded-full hover:scale-105 transition-transform shadow-[0_0_20px_rgba(255,255,255,0.3)]">
                {{CTA_TEXT}}
            </a>
            <a href="{{SECONDARY_LINK}}" class="px-8 py-4 bg-transparent border-2 border-white text-white font-bold rounded-full hover:bg-white/10 transition-colors backdrop-blur-sm">
                {{SECONDARY_TEXT}}
            </a>
        </div>
    </div>
</section>
