<!-- TURNERO MODAL -->
<div id="turneroModal" class="turnero-modal">
    <div class="turnero-overlay" onclick="closeTurnero()"></div>
    <div class="turnero-container">
        <button class="turnero-close" onclick="closeTurnero()">✕</button>

        <div class="turnero-header">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="4" width="18" height="18" rx="2" />
                <line x1="16" y1="2" x2="16" y2="6" />
                <line x1="8" y1="2" x2="8" y2="6" />
                <line x1="3" y1="10" x2="21" y2="10" />
            </svg>
            <h3>Reservar Visita al Showroom</h3>
        </div>

        <!-- Step 1: Calendar -->
        <div id="turneroStep1" class="turnero-step active">
            <div class="turnero-month-nav">
                <button onclick="prevMonth()">◀</button>
                <span id="currentMonthYear"></span>
                <button onclick="nextMonth()">▶</button>
            </div>
            <div class="turnero-weekdays">
                <span>Dom</span><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span>
            </div>
            <div id="calendarGrid" class="turnero-calendar"></div>
        </div>

        <!-- Step 2: Time -->
        <div id="turneroStep2" class="turnero-step">
            <p class="turnero-selected-date" id="selectedDateDisplay"></p>
            <div id="timeSlots" class="turnero-times"></div>
            <button class="turnero-back" onclick="goBack()">← Cambiar fecha</button>
        </div>

        <!-- Step 3: Confirm -->
        <div id="turneroStep3" class="turnero-step">
            <div class="turnero-summary">
                <div class="summary-item">
                    <span class="label">📅 Fecha</span>
                    <span class="value" id="confirmDate"></span>
                </div>
                <div class="summary-item">
                    <span class="label">🕐 Hora</span>
                    <span class="value" id="confirmTime"></span>
                </div>
            </div>
            <input type="text" id="clientName" placeholder="Tu nombre (opcional)" class="turnero-input">
            <button onclick="sendToWhatsApp()" class="turnero-send" id="btnConfirmar">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path
                        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                </svg>
                Confirmar por WhatsApp
            </button>
            <button class="turnero-back" onclick="goBackToTime()">← Cambiar hora</button>
        </div>
    </div>
</div>

<style>
    /* Turnero Modal Styles */
    .turnero-modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .turnero-modal.active {
        display: flex;
    }

    .turnero-overlay {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.8);
        backdrop-filter: blur(5px);
    }

    .turnero-container {
        position: relative;
        background: var(--light);
        /* Adaptive */
        border: 1px solid rgba(212, 165, 116, 0.2);
        border-radius: 20px;
        padding: 2rem;
        max-width: 400px;
        width: 90%;
        max-height: 90vh;
        overflow-y: auto;
        color: var(--dark);
    }

    .turnero-close {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: none;
        border: none;
        color: #888;
        font-size: 1.2rem;
        cursor: pointer;
    }

    .turnero-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
        color: var(--primary);
    }

    .turnero-header h3 {
        font-family: var(--font-head);
        font-size: 1.1rem;
        margin: 0;
    }

    .turnero-step {
        display: none;
    }

    .turnero-step.active {
        display: block;
    }

    .turnero-month-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
    }

    .turnero-month-nav button {
        background: rgba(212, 165, 116, 0.1);
        border: none;
        color: var(--primary);
        padding: 0.5rem 1rem;
        border-radius: 8px;
        cursor: pointer;
    }

    .turnero-month-nav span {
        font-family: var(--font-head);
        font-weight: bold;
    }

    .turnero-weekdays {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 0.25rem;
        margin-bottom: 0.5rem;
    }

    .turnero-weekdays span {
        text-align: center;
        font-size: 0.7rem;
        color: #888;
        text-transform: uppercase;
    }

    .turnero-calendar {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 0.25rem;
    }

    .turnero-day {
        aspect-ratio: 1;
        border: none;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s;
        background: #f5f5f5;
        color: #333;
    }

    .turnero-day.today {
        box-shadow: inset 0 0 0 2px var(--primary);
    }

    .turnero-day.available {
        background: rgba(212, 165, 116, 0.1);
        color: #333;
    }

    .turnero-day.available:hover {
        background: var(--primary);
        color: #fff;
    }

    .turnero-day.unavailable {
        color: #ccc;
        background: transparent;
        cursor: not-allowed;
    }

    .turnero-selected-date {
        text-align: center;
        color: var(--primary);
        font-family: var(--font-head);
        margin-bottom: 1rem;
    }

    .turnero-times {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        max-height: 200px;
        overflow-y: auto;
    }

    .turnero-time {
        padding: 0.75rem;
        background: rgba(212, 165, 116, 0.1);
        border: 1px solid transparent;
        border-radius: 8px;
        color: #333;
        cursor: pointer;
        font-size: 0.85rem;
        transition: all 0.2s;
    }

    .turnero-time:hover {
        background: var(--primary);
        color: #fff;
    }

    .turnero-back {
        width: 100%;
        margin-top: 1rem;
        padding: 0.75rem;
        background: transparent;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #666;
        cursor: pointer;
        font-size: 0.85rem;
    }

    .turnero-summary {
        background: rgba(212, 165, 116, 0.1);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 1rem;
    }

    .summary-item {
        display: flex;
        justify-content: space-between;
        padding: 0.5rem 0;
        color: #333;
    }

    .turnero-input {
        width: 100%;
        padding: 0.75rem 1rem;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 8px;
        color: #333;
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }

    .turnero-send {
        width: 100%;
        padding: 1rem;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        color: #fff;
        font-weight: 700;
        font-size: 0.95rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .turnero-send:hover {
        transform: translateY(-2px);
        opacity: 0.9;
    }
</style>

<script>
    // Turnero Widget - Vanilla JS
    const MONTHS = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
    const WORK_DAYS = [1, 2, 3, 4, 5, 6]; // Lun-Sab
    const START_HOUR = 10;
    const END_HOUR = 20;

    let currentMonth = new Date();
    let selectedDate = null;
    let selectedTime = null;

    function openTurnero() {
        const modal = document.getElementById('turneroModal');
        if (modal) {
            modal.classList.add('active');
            renderCalendar();
        } else {
            console.error("Turnero Modal not found");
        }
    }

    function closeTurnero() {
        document.getElementById('turneroModal').classList.remove('active');
        // Reset
        showStep(1);
        selectedDate = null;
        selectedTime = null;
    }

    function showStep(n) {
        document.querySelectorAll('.turnero-step').forEach(s => s.classList.remove('active'));
        document.getElementById('turneroStep' + n).classList.add('active');
    }

    function renderCalendar() {
        const year = currentMonth.getFullYear();
        const month = currentMonth.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        document.getElementById('currentMonthYear').textContent =
            MONTHS[month] + ' ' + year;

        let html = '';

        // Padding days from prev month
        for (let i = 0; i < firstDay.getDay(); i++) {
            const d = new Date(year, month, -firstDay.getDay() + i + 1);
            html += `<button class="turnero-day other-month" disabled>${d.getDate()}</button>`;
        }

        // Current month days
        for (let day = 1; day <= lastDay.getDate(); day++) {
            const d = new Date(year, month, day);
            const isPast = d < today;
            const isWorkDay = WORK_DAYS.includes(d.getDay());
            const isToday = d.toDateString() === today.toDateString();

            let cls = 'turnero-day ';
            if (isToday) cls += 'today ';
            if (!isPast && isWorkDay) {
                cls += 'available';
                html += `<button class="${cls}" onclick="selectDate(${year}, ${month}, ${day})">${day}</button>`;
            } else {
                cls += 'unavailable';
                html += `<button class="${cls}" disabled>${day}</button>`;
            }
        }

        document.getElementById('calendarGrid').innerHTML = html;
    }

    function prevMonth() {
        const prev = new Date(currentMonth.getFullYear(), currentMonth.getMonth() - 1, 1);
        const today = new Date();
        if (prev >= new Date(today.getFullYear(), today.getMonth(), 1)) {
            currentMonth = prev;
            renderCalendar();
        }
    }

    function nextMonth() {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 1);
        renderCalendar();
    }

    function selectDate(year, month, day) {
        selectedDate = new Date(year, month, day);
        document.getElementById('selectedDateDisplay').textContent =
            selectedDate.toLocaleDateString('es-AR', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
        renderTimeSlots();
        showStep(2);
    }

    function renderTimeSlots() {
        let html = '';
        for (let h = START_HOUR; h < END_HOUR; h++) {
            const time = h.toString().padStart(2, '0') + ':00';
            html += `<button class="turnero-time" onclick="selectTime('${time}')">${time}</button>`;
        }
        document.getElementById('timeSlots').innerHTML = html;
    }

    function selectTime(time) {
        selectedTime = time;
        document.getElementById('confirmDate').textContent =
            selectedDate.toLocaleDateString('es-AR', {
                weekday: 'long', day: 'numeric', month: 'long'
            });
        document.getElementById('confirmTime').textContent = time + ' hs';
        showStep(3);
    }

    function goBack() { showStep(1); }
    function goBackToTime() { showStep(2); }

    function sendToWhatsApp() {
        if (!selectedDate || !selectedTime) return;

        const name = document.getElementById('clientName').value || 'Cliente';
        const message = `Hola! Quiero reservar turno en el Showroom para el ${selectedDate.toLocaleDateString('es-AR')} a las ${selectedTime} hs. Soy ${name}.`;

        // Envío directo a WhatsApp 
        const waUrl = `https://wa.me/5493816202789?text=${encodeURIComponent(message)}`;

        window.open(waUrl, '_blank');
        closeTurnero();
    }
</script>
