<!-- WIDGET: Gallery_v2_Stories_Grid -->
<!-- VIBE: Instagram Stories / Reels — Kinetic, Vertical, Dark/Light Adaptive -->
<!-- Archivo: backend/stitch/widgets/galleries/gallery_v2_stories_grid.html -->

<section id="stories" class="py-14 bg-transparent dark:bg-zinc-950/40" aria-label="Galería Stories">
  <div class="max-w-6xl mx-auto px-4">

    <!-- Header -->
    <div class="flex items-center justify-between mb-8">
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-zinc-400 dark:text-zinc-500 mb-1">
          📸 Momentos Reales
        </p>
        <h2 class="text-2xl md:text-3xl font-extrabold text-zinc-900 dark:text-zinc-50 tracking-tight">
          {{BUSINESS_NAME}}
        </h2>
      </div>
      <!-- Badge IG -->
      <a href="https://instagram.com/{{INSTAGRAM_HANDLE}}" target="_blank" rel="noopener noreferrer"
         class="flex items-center gap-2 px-4 py-2 rounded-full bg-zinc-100 dark:bg-zinc-800/80 border border-zinc-200 dark:border-zinc-700 hover:border-pink-500/50 transition-all group">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" class="text-pink-500">
          <rect x="2" y="2" width="20" height="20" rx="5" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor"/>
        </svg>
        <span class="text-xs font-bold text-zinc-600 dark:text-zinc-300 group-hover:text-pink-500 transition-colors">
          @{{INSTAGRAM_HANDLE}}
        </span>
      </a>
    </div>

    <!-- Stories Grid — 5 cards verticales 4:5 -->
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">

      <!-- Story Card 1 -->
      <div class="group relative rounded-2xl overflow-hidden aspect-[4/5] bg-zinc-200 dark:bg-zinc-800 cursor-pointer shadow-lg hover:shadow-2xl hover:shadow-black/30 transition-shadow duration-300">
        <img src="{{PHOTO_1}}" alt="Story 1" loading="lazy"
             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 will-change-transform" />
        <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
        <div class="absolute bottom-3 left-3 right-3">
          <span class="text-white text-[10px] font-semibold leading-tight line-clamp-2 drop-shadow-lg">
            {{CAPTION_1}}
          </span>
        </div>
        <!-- Instagram badge -->
        <div class="absolute top-2.5 left-2.5 w-6 h-6 rounded-full bg-gradient-to-br from-pink-500 via-rose-500 to-amber-500 flex items-center justify-center shadow-md">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="white" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="2.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="white"/></svg>
        </div>
      </div>

      <!-- Story Card 2 -->
      <div class="group relative rounded-2xl overflow-hidden aspect-[4/5] bg-zinc-200 dark:bg-zinc-800 cursor-pointer shadow-lg hover:shadow-2xl hover:shadow-black/30 transition-shadow duration-300">
        <img src="{{PHOTO_2}}" alt="Story 2" loading="lazy"
             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 will-change-transform" />
        <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
        <div class="absolute bottom-3 left-3 right-3">
          <span class="text-white text-[10px] font-semibold leading-tight line-clamp-2 drop-shadow-lg">
            {{CAPTION_2}}
          </span>
        </div>
        <div class="absolute top-2.5 left-2.5 w-6 h-6 rounded-full bg-gradient-to-br from-pink-500 via-rose-500 to-amber-500 flex items-center justify-center shadow-md">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="white" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="2.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="white"/></svg>
        </div>
      </div>

      <!-- Story Card 3 -->
      <div class="group relative rounded-2xl overflow-hidden aspect-[4/5] bg-zinc-200 dark:bg-zinc-800 cursor-pointer shadow-lg hover:shadow-2xl hover:shadow-black/30 transition-shadow duration-300">
        <img src="{{PHOTO_3}}" alt="Story 3" loading="lazy"
             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 will-change-transform" />
        <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
        <div class="absolute bottom-3 left-3 right-3">
          <span class="text-white text-[10px] font-semibold leading-tight line-clamp-2 drop-shadow-lg">
            {{CAPTION_3}}
          </span>
        </div>
        <div class="absolute top-2.5 left-2.5 w-6 h-6 rounded-full bg-gradient-to-br from-pink-500 via-rose-500 to-amber-500 flex items-center justify-center shadow-md">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="white" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="2.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="white"/></svg>
        </div>
      </div>

      <!-- Story Card 4 -->
      <div class="group relative rounded-2xl overflow-hidden aspect-[4/5] bg-zinc-200 dark:bg-zinc-800 cursor-pointer shadow-lg hover:shadow-2xl hover:shadow-black/30 transition-shadow duration-300 hidden md:block">
        <img src="{{PHOTO_4}}" alt="Story 4" loading="lazy"
             class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105 will-change-transform" />
        <div class="absolute inset-x-0 bottom-0 h-2/3 bg-gradient-to-t from-black/70 via-black/20 to-transparent"></div>
        <div class="absolute bottom-3 left-3 right-3">
          <span class="text-white text-[10px] font-semibold leading-tight line-clamp-2 drop-shadow-lg">
            {{CAPTION_4}}
          </span>
        </div>
        <div class="absolute top-2.5 left-2.5 w-6 h-6 rounded-full bg-gradient-to-br from-pink-500 via-rose-500 to-amber-500 flex items-center justify-center shadow-md">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="white"><rect x="2" y="2" width="20" height="20" rx="5" fill="none" stroke="white" stroke-width="2.5"/><circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="2.5"/><circle cx="17.5" cy="6.5" r="1.2" fill="white"/></svg>
        </div>
      </div>

      <!-- Story Card 5 — Ver más en IG -->
      <div class="group relative rounded-2xl overflow-hidden aspect-[4/5] bg-gradient-to-br from-pink-500/10 via-rose-500/10 to-amber-500/10 dark:from-pink-500/20 dark:via-rose-500/20 dark:to-amber-500/20 border-2 border-dashed border-pink-500/30 dark:border-pink-500/40 cursor-pointer shadow-lg hover:shadow-2xl transition-all duration-300 hidden md:flex items-center justify-center">
        <a href="https://instagram.com/{{INSTAGRAM_HANDLE}}" target="_blank" rel="noopener noreferrer"
           class="flex flex-col items-center gap-2 text-center p-4">
          <div class="w-12 h-12 rounded-full bg-gradient-to-br from-pink-500 via-rose-500 to-amber-500 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" class="text-white" stroke="white" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </div>
          <span class="text-xs font-bold text-pink-500 dark:text-pink-400 leading-tight">Ver todo en Instagram</span>
          <span class="text-[10px] text-zinc-400">@{{INSTAGRAM_HANDLE}}</span>
        </a>
      </div>

    </div>
  </div>
</section>
