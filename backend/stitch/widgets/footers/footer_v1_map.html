<!-- WIDGET: Footer_Map_Local -->
<!-- VIBE: Practical, Local, Dark/Light Adaptive -->
<footer class="bg-zinc-100 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 pt-16 pb-8 border-t border-zinc-200 dark:border-zinc-900 transition-colors" id="contacto">
    <div class="container mx-auto px-6 grid grid-cols-1 md:grid-cols-2 gap-12 mb-12 max-w-6xl">
        <!-- Info Column -->
        <div>
            <h3 class="text-2xl font-extrabold mb-4 text-emerald-600 dark:text-emerald-400 tracking-tight">{{COMPANY_NAME}}</h3>
            <p class="text-zinc-600 dark:text-zinc-400 mb-6 max-w-sm text-sm leading-relaxed">{{COMPANY_DESC}}</p>
            <ul class="space-y-3.5 text-sm">
                <li class="flex items-start gap-3">
                    <span class="text-emerald-500 text-base">📍</span>
                    <span class="text-zinc-700 dark:text-zinc-300 font-medium">{{ADDRESS_LINE}}</span>
                </li>
                <li class="flex items-center gap-3">
                    <span class="text-emerald-500 text-base">📞</span>
                    <a href="tel:{{PHONE_NUMBER}}" class="text-zinc-700 dark:text-zinc-300 hover:text-emerald-500 transition-colors font-medium">{{PHONE_NUMBER}}</a>
                </li>
                <li class="flex items-center gap-3">
                    <span class="text-emerald-500 text-base">✉️</span>
                    <span class="text-zinc-700 dark:text-zinc-300">{{EMAIL_ADDRESS}}</span>
                </li>
            </ul>
        </div>
        
        <!-- Map Column -->
        <div class="rounded-2xl overflow-hidden h-64 md:h-full bg-zinc-200 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-800 relative shadow-inner">
             <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14238.25880797175!2d-65.207166!3d-26.824166!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMjbCsDQ5JzI3LjAiUyA2NcKwMTInMjUuOCJX!5e0!3m2!1sen!2sar!4v1" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
        </div>
    </div>
    
    <div class="border-t border-zinc-200 dark:border-zinc-900 pt-8 text-center text-zinc-400 dark:text-zinc-600 text-xs">
        <p>&copy; 2026 {{COMPANY_NAME}} • Powered by <a href="#" class="text-emerald-600 dark:text-emerald-400 font-semibold hover:underline">Tucu Red Engine</a>.</p>
    </div>
</footer>
