<!-- POWER-UP: Promo_Countdown_Bar -->
<!-- VIBE: Urgency, Sleek Dark/Light Floating Bar -->
<div id="promoBar" class="fixed bottom-0 left-0 w-full bg-zinc-900/95 dark:bg-black/95 text-white py-3.5 px-4 z-50 flex flex-col md:flex-row items-center justify-center gap-4 text-center border-t border-amber-500/30 backdrop-blur-md shadow-2xl transition-all">
    <div class="flex items-center gap-2">
        <span class="text-lg">🔥</span>
        <span class="font-extrabold uppercase tracking-wider text-xs md:text-sm text-amber-400">{{PROMO_TEXT}}</span>
    </div>
    
    <div class="flex items-center gap-2 font-mono text-sm font-black bg-white/10 dark:bg-zinc-800/80 px-3.5 py-1 rounded-xl border border-white/10">
        <span id="promoHours" class="text-amber-400">00</span>h :
        <span id="promoMinutes" class="text-amber-400">00</span>m :
        <span id="promoSeconds" class="text-amber-400">00</span>s
    </div>

    <button onclick="scrollToPromo()" class="bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-black font-black px-5 py-1.5 rounded-xl text-xs uppercase tracking-wider transition-transform hover:scale-105 shadow-md">
        {{PROMO_CTA}}
    </button>
    
    <button onclick="closePromo()" class="absolute top-2 right-2 md:relative md:top-auto md:right-auto text-zinc-400 hover:text-white p-1 text-xs">✕</button>
</div>

<script>
    const HOURS_LEFT = Number("{{PROMO_HOURS_DURATION}}") || 4; 
    const deadline = new Date(Date.now() + HOURS_LEFT * 60 * 60 * 1000);

    function updateTimer() {
        const now = new Date();
        const diff = deadline - now;

        if (diff <= 0) {
            const bar = document.getElementById('promoBar');
            if (bar) bar.style.display = 'none';
            return;
        }

        const h = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const m = Math.floor((diff / 1000 / 60) % 60);
        const s = Math.floor((diff / 1000) % 60);

        const elH = document.getElementById('promoHours');
        const elM = document.getElementById('promoMinutes');
        const elS = document.getElementById('promoSeconds');
        if (elH) elH.innerText = String(h).padStart(2, '0');
        if (elM) elM.innerText = String(m).padStart(2, '0');
        if (elS) elS.innerText = String(s).padStart(2, '0');
    }

    setInterval(updateTimer, 1000);
    updateTimer();

    function closePromo() {
        document.getElementById('promoBar')?.remove();
    }

    function scrollToPromo() {
        const target = document.querySelector('#booking') || document.querySelector('#cotizador') || document.querySelector('section');
        if (target) target.scrollIntoView({ behavior: 'smooth' });
    }
</script>
