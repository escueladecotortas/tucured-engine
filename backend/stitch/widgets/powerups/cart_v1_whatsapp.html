<!-- POWER-UP: Cart_WhatsApp_Lite -->
<!-- VIBE: Floating, Utility, Dark/Light Adaptive -->

<!-- Floating Cart Button -->
<div id="cartFab" class="fixed bottom-6 right-6 z-40 hidden">
    <button onclick="toggleCart()" class="relative bg-emerald-600 hover:bg-emerald-500 text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform border-2 border-white dark:border-zinc-800">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span id="cartCount" class="absolute -top-2 -right-2 bg-amber-500 text-black text-xs font-black w-6 h-6 rounded-full flex items-center justify-center border-2 border-white dark:border-zinc-900 animate-bounce">0</span>
    </button>
</div>

<!-- Cart Sidebar/Modal -->
<div id="cartModal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
    <div class="absolute top-0 right-0 h-full w-full max-w-sm bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-100 shadow-2xl border-l border-zinc-200 dark:border-zinc-800 transform transition-transform duration-300 translate-x-full" id="cartPanel">
        <div class="flex flex-col h-full">
            <!-- Header -->
            <div class="p-6 bg-zinc-50 dark:bg-zinc-800/60 border-b border-zinc-200 dark:border-zinc-800 flex justify-between items-center">
                <h3 class="text-lg font-extrabold flex items-center gap-2">
                    <span>🛒</span> Tu Pedido
                </h3>
                <button onclick="toggleCart()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1">✕</button>
            </div>

            <!-- Items List -->
            <div id="cartItems" class="flex-1 overflow-y-auto p-6 space-y-4">
                <p class="text-center text-zinc-400 dark:text-zinc-500 mt-10 text-sm">Tu carrito está vacío.</p>
            </div>

            <!-- Footer / Checkout -->
            <div class="p-6 bg-zinc-50 dark:bg-zinc-800/60 border-t border-zinc-200 dark:border-zinc-800 space-y-4">
                <div class="flex justify-between items-center text-lg font-bold">
                    <span class="text-zinc-600 dark:text-zinc-400 text-sm">Total Estimado:</span>
                    <span id="cartTotal" class="text-emerald-600 dark:text-emerald-400 font-mono font-black text-xl">$0</span>
                </div>
                <div class="space-y-2">
                     <input type="text" id="cartName" placeholder="Tu Nombre" class="w-full px-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                     <input type="text" id="cartAddress" placeholder="Dirección / Mesa (Opcional)" class="w-full px-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-[#25D366] hover:bg-[#20ba59] text-white font-bold py-3.5 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2 text-sm">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                    Enviar Pedido por WhatsApp
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    const WA_NUMBER_CART = "{{WHATSAPP_NUMBER}}" || "+5493815559876";
    let cart = [];

    function toggleCart() {
        const modal = document.getElementById('cartModal');
        const panel = document.getElementById('cartPanel');
        if (!modal || !panel) return;
        if (modal.classList.contains('hidden')) {
            modal.classList.remove('hidden');
            setTimeout(() => panel.classList.remove('translate-x-full'), 10);
        } else {
            panel.classList.add('translate-x-full');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    }

    function addToCart(title, price) {
        const p = parseFloat(price) || 0;
        cart.push({ title, price: p });
        updateCartUI();
        const fab = document.getElementById('cartFab');
        if (fab) fab.classList.remove('hidden');
    }

    function updateCartUI() {
        const items = document.getElementById('cartItems');
        const total = document.getElementById('cartTotal');
        const count = document.getElementById('cartCount');
        if (count) count.innerText = cart.length;
        if (items) {
            if (cart.length === 0) {
                items.innerHTML = '<p class="text-center text-zinc-400 dark:text-zinc-500 mt-10 text-sm">Tu carrito está vacío.</p>';
            } else {
                items.innerHTML = cart.map((item, idx) => `
                    <div class="flex justify-between items-center p-3 rounded-xl bg-white dark:bg-zinc-800/80 border border-zinc-200 dark:border-zinc-700 text-sm">
                        <div>
                            <p class="font-bold text-zinc-900 dark:text-zinc-100">${item.title}</p>
                            <p class="text-xs text-emerald-600 dark:text-emerald-400 font-mono">$${item.price.toLocaleString('es-AR')}</p>
                        </div>
                        <button onclick="removeItem(${idx})" class="text-red-500 hover:text-red-700 p-1 text-xs">✕</button>
                    </div>
                `).join('');
            }
        }
        if (total) {
            const sum = cart.reduce((acc, i) => acc + i.price, 0);
            total.innerText = '$' + sum.toLocaleString('es-AR');
        }
    }

    function removeItem(idx) {
        cart.splice(idx, 1);
        updateCartUI();
    }

    function checkoutWhatsApp() {
        if (cart.length === 0) return alert("Tu carrito está vacío.");
        const name = document.getElementById('cartName')?.value.trim() || 'Cliente';
        const address = document.getElementById('cartAddress')?.value.trim() || 'Para retirar';
        const sum = cart.reduce((acc, i) => acc + i.price, 0);
        const itemsText = cart.map(i => `• ${i.title} ($${i.price.toLocaleString('es-AR')})`).join('\n');
        const msg = `¡Hola! Quiero realizar un pedido:\n👤 *Nombre:* ${name}\n📍 *Dirección/Mesa:* ${address}\n\n*Detalle del Pedido:*\n${itemsText}\n\n💰 *Total:* $${sum.toLocaleString('es-AR')}`;
        const cleanPhone = String(WA_NUMBER_CART).replace(/[^0-9]/g, '');
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
