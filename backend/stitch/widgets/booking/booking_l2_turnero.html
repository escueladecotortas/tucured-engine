<!-- Archivo: backend/stitch/widgets/booking/booking_l2_turnero.html -->

    <div class="flex items-center justify-center gap-2 mt-4">
      <div id="step-dot-1-{{WIDGET_ID}}" class="w-7 h-7 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center shadow-lg shadow-blue-500/20 transition-all">1</div>
      <div class="w-8 sm:w-11 h-1 bg-zinc-800 rounded-full overflow-hidden">

      <div class="w-8 sm:w-11 h-1 bg-zinc-800 rounded-full overflow-hidden">
        <div id="step-bar-2-{{WIDGET_ID}}" class="h-full bg-blue-600 w-0 transition-all duration-300"></div>
      </div>
      <div id="step-dot-3-{{WIDGET_ID}}" class="w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 font-bold text-xs flex items-center justify-center transition-all">3</div>
    </div>
  </div>

  <div class="grid w-full overflow-hidden">
    <div id="step-1-{{WIDGET_ID}}" class="[grid-area:1/1] w-full min-w-0 box-border transition-all duration-500 ease-in-out opacity-100 transform translate-x-0">
      <div class="mb-5 w-full">
        <label class="block text-xs sm:text-sm font-medium mb-2 text-zinc-300">Selecciona un día:</label>
        <div class="w-full overflow-x-auto hide-scrollbar pb-2 pt-1 snap-x px-0.5 flex gap-2.5" id="day-selector-{{WIDGET_ID}}"></div>
      </div>
      <div class="w-full">
        <label class="block text-xs sm:text-sm font-medium mb-2 text-zinc-300">Horarios disponibles:</label>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-2.5 w-full max-h-64 sm:max-h-72 overflow-y-auto pr-1 hide-scrollbar" id="time-selector-{{WIDGET_ID}}"></div>
      </div>
      <button id="btn-next-1-{{WIDGET_ID}}" disabled class="mt-6 w-full py-4 rounded-xl font-bold text-sm sm:text-base bg-blue-600 text-white hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20 disabled:bg-zinc-800 disabled:text-zinc-500 disabled:opacity-40 disabled:cursor-not-allowed">Continuar</button>
    </div>

    <div id="step-2-{{WIDGET_ID}}" class="[grid-area:1/1] w-full min-w-0 box-border transition-all duration-500 ease-in-out opacity-0 pointer-events-none transform translate-x-full space-y-4 pt-1">
      <div>
        <label class="block text-xs sm:text-sm font-medium mb-1.5 text-zinc-300">Nombre completo</label>
        <input type="text" id="input-name-{{WIDGET_ID}}" placeholder="Ej. Juan Pérez" class="w-full bg-zinc-950/70 border border-zinc-700/70 rounded-xl px-4 py-3.5 text-sm text-zinc-100 placeholder:text-zinc-500 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
      </div>
      <div>
        <label class="block text-xs sm:text-sm font-medium mb-1.5 text-zinc-300">Teléfono / WhatsApp (Sin 0 ni 15)</label>
        <input type="tel" id="input-phone-{{WIDGET_ID}}" placeholder="Ej. 3811234567" class="w-full bg-zinc-950/70 border border-zinc-700/70 rounded-xl px-4 py-3.5 text-sm text-zinc-100 placeholder:text-zinc-500 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
      </div>
      <div>
        <label class="block text-xs sm:text-sm font-medium mb-1.5 text-zinc-300">Personas / Servicios (Opcional)</label>
        <select id="input-pax-{{WIDGET_ID}}" class="w-full bg-zinc-950/70 border border-zinc-700/70 rounded-xl px-4 py-3.5 text-sm text-zinc-100 outline-none focus:ring-2 focus:ring-blue-500 transition-all appearance-none cursor-pointer">
          <option value="1" class="bg-zinc-900 text-zinc-100">1 Persona</option>
          <option value="2" class="bg-zinc-900 text-zinc-100">2 Personas</option>
          <option value="3" class="bg-zinc-900 text-zinc-100">3 Personas</option>
          <option value="4+" class="bg-zinc-900 text-zinc-100">4+ Personas</option>
        </select>
      </div>
      <div class="flex gap-2.5 pt-2 mt-6">
        <button id="btn-back-2-{{WIDGET_ID}}" class="w-1/3 py-4 rounded-xl font-bold bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/50 transition-colors text-sm">Volver</button>
        <button id="btn-next-2-{{WIDGET_ID}}" class="w-2/3 py-4 rounded-xl font-bold bg-blue-600 text-white hover:bg-blue-500 transition-all shadow-lg shadow-blue-600/20 text-sm">Revisar Reserva</button>
      </div>
    </div>

    <div id="step-3-{{WIDGET_ID}}" class="[grid-area:1/1] w-full min-w-0 box-border transition-all duration-500 ease-in-out opacity-0 pointer-events-none transform translate-x-full flex flex-col justify-between">
      <div class="bg-zinc-950/60 rounded-2xl p-5 sm:p-6 border border-zinc-800/80 w-full min-w-0 box-border">
        <h4 class="font-bold text-base sm:text-lg mb-4 text-center text-white">Resumen de tu reserva</h4>
        <ul class="space-y-3 text-xs sm:text-sm w-full min-w-0">
          <li class="flex justify-between items-start gap-3 border-b border-zinc-800/80 pb-2.5 min-w-0">
            <span class="text-zinc-400 flex-shrink-0">Reserva ID:</span>
            <span class="font-mono text-xs text-blue-400 font-bold text-right break-words min-w-0" id="summary-hash-{{WIDGET_ID}}">-</span>
          </li>
          <li class="flex justify-between items-start gap-3 border-b border-zinc-800/80 pb-2.5 min-w-0">
            <span class="text-zinc-400 flex-shrink-0">Nombre:</span>
            <span class="font-semibold text-zinc-100 text-right break-words min-w-0" id="summary-name-{{WIDGET_ID}}">-</span>
          </li>
          <li class="flex justify-between items-start gap-3 border-b border-zinc-800/80 pb-2.5 min-w-0">
            <span class="text-zinc-400 flex-shrink-0">Día:</span>
            <span class="font-semibold text-zinc-100 text-right break-words min-w-0" id="summary-day-{{WIDGET_ID}}">-</span>
          </li>
          <li class="flex justify-between items-start gap-3 border-b border-zinc-800/80 pb-2.5 min-w-0">
            <span class="text-zinc-400 flex-shrink-0">Hora:</span>
            <span class="font-semibold text-blue-400 text-right break-words min-w-0" id="summary-time-{{WIDGET_ID}}">-</span>
          </li>
          <li class="flex justify-between items-start gap-3 min-w-0">
            <span class="text-zinc-400 flex-shrink-0">Para:</span>
            <span class="font-semibold text-zinc-100 text-right break-words min-w-0" id="summary-pax-{{WIDGET_ID}}">-</span>
          </li>
        </ul>
      </div>
      <div class="flex flex-col gap-2.5 mt-6">
        <div class="flex gap-2.5">
          <button id="btn-back-3-{{WIDGET_ID}}" class="w-1/3 py-4 rounded-xl font-bold bg-zinc-800 hover:bg-zinc-700 text-zinc-300 border border-zinc-700/50 transition-colors text-sm">Editar</button>
          <button id="btn-confirm-{{WIDGET_ID}}" class="w-2/3 py-4 rounded-xl font-bold bg-emerald-600 text-white shadow-lg shadow-emerald-600/30 hover:bg-emerald-500 transition-colors flex items-center justify-center gap-2 text-sm">Confirmar WA</button>
        </div>
        <button id="btn-ics-{{WIDGET_ID}}" class="w-full py-3 rounded-xl text-xs sm:text-sm font-semibold bg-zinc-800 hover:bg-zinc-700 text-zinc-200 border border-zinc-700/60 transition-colors flex items-center justify-center gap-2 shadow-sm">
          <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          Añadir al Calendario (.ics)
        </button>
      </div>
    </div>
  </div>

  <style>
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>

  <script>
    (function() {
      function initWidget() {
        const wId = "{{WIDGET_ID}}";
        const dom = {
          s1: document.getElementById('step-1-' + wId), s2: document.getElementById('step-2-' + wId), s3: document.getElementById('step-3-' + wId),
          d1: document.getElementById('step-dot-1-' + wId), d2: document.getElementById('step-dot-2-' + wId), d3: document.getElementById('step-dot-3-' + wId),
          b1: document.getElementById('step-bar-1-' + wId), b2: document.getElementById('step-bar-2-' + wId),
          sub: document.getElementById('turnero-subtitle-' + wId), daySel: document.getElementById('day-selector-' + wId), timeSel: document.getElementById('time-selector-' + wId),
          btnNext1: document.getElementById('btn-next-1-' + wId), btnNext2: document.getElementById('btn-next-2-' + wId),
          btnBack2: document.getElementById('btn-back-2-' + wId), btnBack3: document.getElementById('btn-back-3-' + wId),
          btnConfirm: document.getElementById('btn-confirm-' + wId), btnIcs: document.getElementById('btn-ics-' + wId),
          inpName: document.getElementById('input-name-' + wId), inpPhone: document.getElementById('input-phone-' + wId), inpPax: document.getElementById('input-pax-' + wId),
          sumHash: document.getElementById('summary-hash-' + wId), sumName: document.getElementById('summary-name-' + wId),
          sumDay: document.getElementById('summary-day-' + wId), sumTime: document.getElementById('summary-time-' + wId), sumPax: document.getElementById('summary-pax-' + wId)
        };
        if (!dom.s1 || !dom.btnNext1) return;

        const state = { step: 1, day: null, dateObj: null, time: null, name: "", phone: "", pax: "1", isToday: false, hash: "" };
        const waNumber = "{{WHATSAPP_NUMBER}}".replace(/[^0-9]/g, '');
        const bizName = "{{BUSINESS_NAME}}";

        const fetchAvailability = async (dateStr) => {
          return new Promise(resolve => setTimeout(() => resolve({ occupied: ["09:30", "11:30", "17:00"], businessHours: { start: "09:00", end: "21:00", intervalMinutes: 30 } }), 150));
        };

        const sanitizePhone = (val) => {
          let num = val.replace(/\D/g, '');
          num = num.replace(/^549?/, '').replace(/^0/, '').replace(/^(\d{2,4})15/, '$1');
          return num;
        };

        if (dom.inpPhone) {
          dom.inpPhone.addEventListener('blur', (e) => { e.target.value = sanitizePhone(e.target.value); });
          dom.inpPhone.addEventListener('paste', (e) => { setTimeout(() => { e.target.value = sanitizePhone(e.target.value); }, 10); });
        }

        const getDays = () => {
          const days = []; const date = new Date(); const names = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
          for(let i=0; i<7; i++) {
            const d = new Date(date); d.setDate(date.getDate() + i);
            days.push({ isToday: i === 0, label: i === 0 ? 'Hoy' : i === 1 ? 'Mañana' : names[d.getDay()], date: d.getDate(), fullDate: d, fullStr: d.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long' }) });
          }
          return days;
        };

        const generateTimeSlots = (config) => {
          const slots = []; let current = new Date(`2000-01-01T${config.start}:00`); const end = new Date(`2000-01-01T${config.end}:00`);
          while (current <= end) { slots.push(current.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })); current.setMinutes(current.getMinutes() + config.intervalMinutes); }
          return slots;
        };

        const checkStep1 = () => { if (dom.btnNext1) dom.btnNext1.disabled = !(state.day && state.time); };

        const renderDays = async () => {
          const days = getDays();
          dom.daySel.innerHTML = days.map((d, i) => `
            <button data-idx="${i}" class="day-btn min-w-[4.5rem] w-[4.5rem] sm:min-w-[4.8rem] sm:w-[4.8rem] flex-shrink-0 snap-start rounded-2xl py-2.5 px-2 flex flex-col items-center justify-center border transition-all text-center cursor-pointer select-none bg-zinc-800/70 hover:bg-zinc-800 text-zinc-300 border-zinc-700/60">
              <span class="text-[10px] sm:text-[11px] font-medium opacity-80 uppercase tracking-wider">${d.label}</span>
              <span class="font-bold text-base sm:text-lg leading-tight mt-0.5 text-white">${d.date}</span>
            </button>`).join('');

          dom.daySel.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
              dom.daySel.querySelectorAll('.day-btn').forEach(b => {
                b.className = 'day-btn min-w-[4.5rem] w-[4.5rem] sm:min-w-[4.8rem] sm:w-[4.8rem] flex-shrink-0 snap-start rounded-2xl py-2.5 px-2 flex flex-col items-center justify-center border transition-all text-center cursor-pointer select-none bg-zinc-800/70 hover:bg-zinc-800 text-zinc-300 border-zinc-700/60';
              });
              const t = e.currentTarget;
              t.className = 'day-btn min-w-[4.5rem] w-[4.5rem] sm:min-w-[4.8rem] sm:w-[4.8rem] flex-shrink-0 snap-start rounded-2xl py-2.5 px-2 flex flex-col items-center justify-center border transition-all text-center cursor-pointer select-none bg-blue-600 text-white border-blue-500 shadow-lg shadow-blue-600/30 font-bold';
              const dayData = days[parseInt(t.dataset.idx)];
              state.day = dayData.fullStr; state.dateObj = dayData.fullDate; state.isToday = dayData.isToday; state.time = null;
              checkStep1();
              dom.timeSel.innerHTML = '<div class="col-span-full text-center text-xs sm:text-sm text-zinc-400 py-3 flex items-center justify-center gap-2"><span class="w-2 h-2 rounded-full bg-blue-500 animate-ping"></span> Consultando disponibilidad...</div>';
              const availability = await fetchAvailability(state.day);
              renderTimes(availability);
            });
          });
        };

        const renderTimes = (availability) => {
          const slots = generateTimeSlots(availability.businessHours); const now = new Date(); const currentTotalMins = now.getHours() * 60 + now.getMinutes();
          dom.timeSel.innerHTML = slots.map(t => {
            const isOccupied = availability.occupied.includes(t);
            const [sh, sm] = t.split(':').map(Number);
            const isPast = state.isToday && ((sh * 60 + sm) <= currentTotalMins);
            if (isOccupied || isPast) return `<button disabled class="time-btn opacity-25 bg-zinc-900/60 text-zinc-500 line-through cursor-not-allowed pointer-events-none border border-zinc-800/80 font-normal py-2 text-xs sm:text-sm rounded-xl text-center">${t}</button>`;
            return `<button data-time="${t}" class="time-btn bg-zinc-800/80 hover:bg-blue-600 hover:text-white text-zinc-200 border border-zinc-700/60 font-semibold py-2 text-xs sm:text-sm rounded-xl transition-all text-center">${t}</button>`;
          }).join('');

          dom.timeSel.querySelectorAll('.time-btn:not([disabled])').forEach(btn => {
            btn.addEventListener('click', (e) => {
              dom.timeSel.querySelectorAll('.time-btn:not([disabled])').forEach(b => {
                b.className = 'time-btn bg-zinc-800/80 hover:bg-blue-600 hover:text-white text-zinc-200 border border-zinc-700/60 font-semibold py-2 text-xs sm:text-sm rounded-xl transition-all text-center';
              });
              const target = e.currentTarget;
              target.className = 'time-btn bg-blue-600 text-white border-blue-500 shadow-md shadow-blue-600/30 font-bold py-2 text-xs sm:text-sm rounded-xl transition-all text-center';
              state.time = target.dataset.time; checkStep1();
            });
          });
        };

        const goStep = (step) => {
          [dom.s1, dom.s2, dom.s3].forEach(s => { if (s) { s.classList.remove('opacity-100', 'translate-x-0', 'pointer-events-auto'); s.classList.add('opacity-0', 'pointer-events-none'); } });
          const setStepUI = (activeStep, title) => {
            if (dom.sub) dom.sub.innerText = title;
            [dom.d1, dom.d2, dom.d3].forEach((d, idx) => {
              if (idx + 1 === activeStep) d.className = 'w-7 h-7 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center shadow-lg shadow-blue-500/20 ring-4 ring-blue-500/20 transition-all';
              else if (idx + 1 < activeStep) d.className = 'w-7 h-7 rounded-full bg-blue-600 text-white font-bold text-xs flex items-center justify-center transition-all';
              else d.className = 'w-7 h-7 rounded-full bg-zinc-800 text-zinc-400 font-bold text-xs flex items-center justify-center transition-all';
            });
            if (dom.b1) dom.b1.className = activeStep > 1 ? 'h-full bg-blue-600 w-full transition-all duration-300' : 'h-full bg-blue-600 w-0 transition-all duration-300';
            if (dom.b2) dom.b2.className = activeStep > 2 ? 'h-full bg-blue-600 w-full transition-all duration-300' : 'h-full bg-blue-600 w-0 transition-all duration-300';
          };

          if(step === 1) {
            dom.s1.classList.remove('-translate-x-full'); dom.s1.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            dom.s2.classList.add('translate-x-full'); dom.s3.classList.add('translate-x-full');
            setStepUI(1, "Paso 1: Selecciona fecha y hora");
          } else if (step === 2) {
            dom.s1.classList.add('-translate-x-full'); dom.s2.classList.remove('translate-x-full', '-translate-x-full');
            dom.s2.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto'); dom.s3.classList.add('translate-x-full');
            setStepUI(2, "Paso 2: Datos para la reserva");
          } else if (step === 3) {
            state.hash = Math.random().toString(36).substring(2,8).toUpperCase();
            if (dom.sumHash) dom.sumHash.innerText = "#" + state.hash;
            if (dom.sumName) dom.sumName.innerText = state.name; if (dom.sumDay) dom.sumDay.innerText = state.day;
            if (dom.sumTime) dom.sumTime.innerText = state.time; if (dom.sumPax) dom.sumPax.innerText = state.pax + " persona(s)";
            dom.s1.classList.add('-translate-x-full'); dom.s2.classList.add('-translate-x-full');
            dom.s3.classList.remove('translate-x-full'); dom.s3.classList.add('translate-x-0', 'opacity-100', 'pointer-events-auto');
            setStepUI(3, "Paso 3: Confirma tu solicitud");
          }
        };

        if (dom.btnNext1) dom.btnNext1.addEventListener('click', () => goStep(2));
        if (dom.btnBack2) dom.btnBack2.addEventListener('click', () => goStep(1));
        if (dom.btnNext2) dom.btnNext2.addEventListener('click', () => {
          state.name = dom.inpName ? dom.inpName.value.trim() : "";
          if (dom.inpPhone) dom.inpPhone.value = sanitizePhone(dom.inpPhone.value);
          state.phone = dom.inpPhone ? dom.inpPhone.value.trim() : "";
          state.pax = dom.inpPax ? dom.inpPax.value : "1";
          if(!state.name) { dom.inpName.classList.add('ring-2', 'ring-red-500'); setTimeout(() => dom.inpName.classList.remove('ring-2', 'ring-red-500'), 1000); return; }
          if(!state.phone) { dom.inpPhone.classList.add('ring-2', 'ring-red-500'); setTimeout(() => dom.inpPhone.classList.remove('ring-2', 'ring-red-500'), 1000); return; }
          goStep(3);
        });
        if (dom.btnBack3) dom.btnBack3.addEventListener('click', () => goStep(2));
        if (dom.btnConfirm) dom.btnConfirm.addEventListener('click', () => {
          const text = `¡Hola! Quiero confirmar mi reserva en ${bizName}:\n- 🎟️ ID: #${state.hash}\n- 👤 Nombre: ${state.name}\n- 📅 Día: ${state.day}\n- ⏰ Hora: ${state.time}\n- 👥 Pax: ${state.pax}\n- 📞 Tel: ${state.phone}\n¿Me confirman disponibilidad?`;
          window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(text)}`, '_blank');
        });
        if (dom.btnIcs) dom.btnIcs.addEventListener('click', () => {
          if(!state.dateObj || !state.time) return;
          const [h, m] = state.time.split(':'); const d = new Date(state.dateObj); d.setHours(parseInt(h), parseInt(m), 0);
          const endD = new Date(d); endD.setMinutes(endD.getMinutes() + 60);
          const fmt = (dt) => dt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
          const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "BEGIN:VEVENT", `DTSTART:${fmt(d)}`, `DTEND:${fmt(endD)}`, `SUMMARY:Reserva en ${bizName}`, `DESCRIPTION:Reserva para ${state.name} (${state.pax} pax). ID: #${state.hash}`, "END:VEVENT", "END:VCALENDAR"].join("\r\n");
          const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
          const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url;
          a.download = `reserva_${bizName.replace(/\s+/g, '_')}.ics`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
        });

        renderDays();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initWidget); else setTimeout(initWidget, 50);
    })();
  </script>
</div>
