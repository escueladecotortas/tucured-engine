<!-- WIDGET: Booking_WhatsApp_Turnero -->
<!-- VIBE: Modern, Pre-rendered Inline Reservation Panel with WhatsApp Dispatch -->
<section class="py-16 bg-transparent dark:bg-zinc-950/40 backdrop-blur-md transition-colors" id="booking">
    <div class="container mx-auto px-4 max-w-3xl text-center">
        <div class="inline-flex items-center gap-2 mb-3 px-4 py-1 rounded-full bg-emerald-500/10 text-emerald-500 border border-emerald-500/20 text-xs font-bold uppercase tracking-wider">
            <span>📅 Reservas y Turnos Online</span>
        </div>
        <h2 class="text-3xl md:text-4xl font-extrabold text-zinc-900 dark:text-zinc-50 mb-3 tracking-tight">{{BOOKING_TITLE}}</h2>
        <p class="text-zinc-500 dark:text-zinc-400 text-sm max-w-xl mx-auto mb-10">{{BOOKING_desc}}</p>

        <!-- Interactive Reservation Card -->
        <div class="bg-white dark:bg-zinc-900/90 rounded-3xl p-6 md:p-8 shadow-2xl border border-zinc-200 dark:border-zinc-800 text-left transition-all">
            
            <!-- Step 1: Select Day -->
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-3">1. Seleccioná el Día</label>
                <div class="grid grid-cols-3 sm:grid-cols-4 gap-2" id="dayPicker">
                    <button type="button" onclick="selectTurneroDay(this, 'Hoy')" class="turnero-day-btn active-day py-2.5 px-3 rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold text-xs text-center transition-all">Hoy</button>
                    <button type="button" onclick="selectTurneroDay(this, 'Mañana')" class="turnero-day-btn py-2.5 px-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 font-semibold text-xs text-center hover:border-emerald-500 transition-all">Mañana</button>
                    <button type="button" onclick="selectTurneroDay(this, 'Viernes')" class="turnero-day-btn py-2.5 px-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 font-semibold text-xs text-center hover:border-emerald-500 transition-all">Viernes</button>
                    <button type="button" onclick="selectTurneroDay(this, 'Sábado')" class="turnero-day-btn py-2.5 px-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 font-semibold text-xs text-center hover:border-emerald-500 transition-all">Sábado</button>
                </div>
            </div>

            <!-- Step 2: Select Time Slot -->
            <div class="mb-6">
                <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-3">2. Horario Disponible</label>
                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2" id="slotPicker">
                    <button type="button" onclick="selectTurneroSlot(this, '09:00')" class="turnero-slot-btn py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-xs font-mono text-center hover:border-emerald-500 transition-all">09:00</button>
                    <button type="button" onclick="selectTurneroSlot(this, '11:00')" class="turnero-slot-btn py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-xs font-mono text-center hover:border-emerald-500 transition-all">11:00</button>
                    <button type="button" onclick="selectTurneroSlot(this, '16:00')" class="turnero-slot-btn active-slot py-2 rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-mono text-center transition-all">16:00</button>
                    <button type="button" onclick="selectTurneroSlot(this, '18:00')" class="turnero-slot-btn py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-xs font-mono text-center hover:border-emerald-500 transition-all">18:00</button>
                    <button type="button" onclick="selectTurneroSlot(this, '19:30')" class="turnero-slot-btn py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-xs font-mono text-center hover:border-emerald-500 transition-all">19:30</button>
                    <button type="button" onclick="selectTurneroSlot(this, '20:30')" class="turnero-slot-btn py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-xs font-mono text-center hover:border-emerald-500 transition-all">20:30</button>
                </div>
            </div>

            <!-- Step 3: Person Details & Dispatch -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">Tu Nombre</label>
                    <input type="text" id="turneroName" placeholder="Ingresá tu nombre" class="w-full px-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-zinc-500 dark:text-zinc-400 mb-1.5">{{FIELD_2_LABEL}}</label>
                    <select id="turneroPax" class="w-full px-4 py-2.5 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800 text-zinc-900 dark:text-zinc-100 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        {{FIELD_2_OPTIONS}}
                    </select>
                </div>
            </div>

            <!-- CTA Submit -->
            <button type="button" onclick="dispatchTurneroWhatsApp()" class="w-full py-4 px-6 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold text-base shadow-xl flex items-center justify-center gap-3 transition-all duration-200 hover:scale-[1.01] active:scale-[0.99]">
                <span>{{BOOKING_CTA}}</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
            </button>
            <p class="text-center text-[11px] text-zinc-400 dark:text-zinc-500 mt-3">⚡ Confirmación instantánea directa por WhatsApp sin intermediarios.</p>
        </div>
    </div>
</section>

<script>
    let selectedDay = 'Hoy';
    let selectedSlot = '16:00';
    const rawWaNumber = '{{WHATSAPP_NUMBER}}' || '+5493815559876';
    const waIntentText = '{{WA_INTENT_TEXT}}' || 'Quiero solicitar una reserva o turno';

    function selectTurneroDay(btn, day) {
        selectedDay = day;
        document.querySelectorAll('.turnero-day-btn').forEach(b => {
            b.className = 'turnero-day-btn py-2.5 px-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 font-semibold text-xs text-center hover:border-emerald-500 transition-all';
        });
        btn.className = 'turnero-day-btn active-day py-2.5 px-3 rounded-xl border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 font-semibold text-xs text-center transition-all';
    }

    function selectTurneroSlot(btn, slot) {
        selectedSlot = slot;
        document.querySelectorAll('.turnero-slot-btn').forEach(b => {
            b.className = 'turnero-slot-btn py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 bg-zinc-50 dark:bg-zinc-800/50 text-zinc-700 dark:text-zinc-300 text-xs font-mono text-center hover:border-emerald-500 transition-all';
        });
        btn.className = 'turnero-slot-btn active-slot py-2 rounded-lg border border-emerald-500 bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 text-xs font-mono text-center transition-all';
    }

    function dispatchTurneroWhatsApp() {
        const name = document.getElementById('turneroName')?.value.trim() || 'Cliente';
        const detail = document.getElementById('turneroPax')?.value || 'Atención General';
        const msg = `¡Hola! ${waIntentText}:\n👤 *Nombre:* ${name}\n📅 *Día:* ${selectedDay}\n⏰ *Horario:* ${selectedSlot}\n📋 *Detalle:* ${detail}\n\n¿Tienen disponibilidad?`;
        const cleanPhone = rawWaNumber.replace(/[^0-9]/g, '');
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }
</script>
