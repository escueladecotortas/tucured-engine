                </svg>
                <span class="text-[10px] font-bold text-[#25D366]">WhatsApp</span>
            </a>

            <!-- Reserva (Turnero) -->
            <button onclick="scrollToDockTarget('booking')"
               class="flex-1 flex flex-col items-center gap-1 py-2 px-3 rounded-2xl bg-emerald-500/10 hover:bg-emerald-500/20 border border-emerald-500/30 transition-all active:scale-95">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-emerald-500">
                    <rect x="3" y="4" width="18" height="18" rx="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
                </svg>
                <span class="text-[10px] font-bold text-emerald-500">Reservar</span>
            </button>

            <!-- Llamada Directa -->
            <a href="tel:{{PHONE_RAW}}"
               class="flex-1 flex flex-col items-center gap-1 py-2 px-3 rounded-2xl bg-blue-500/10 hover:bg-blue-500/20 border border-blue-500/30 transition-all active:scale-95">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-blue-500">
                    <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.48 11 19.79 19.79 0 01.36 2.38 2 2 0 012.34.22h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L6.91 7.91a16 16 0 006.18 6.18l1.77-1.77a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z"/>
                </svg>
                <span class="text-[10px] font-bold text-blue-500">Llamar</span>
            </a>

            <!-- Ubicación -->
            <a href="{{MAPS_URL}}" target="_blank" rel="noopener noreferrer"
               class="flex-1 flex flex-col items-center gap-1 py-2 px-3 rounded-2xl bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 transition-all active:scale-95">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="text-amber-500">
                    <path d="M12 2C8.134 2 5 5.134 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.866-3.134-7-7-7z"/>
                    <circle cx="12" cy="9" r="2.5"/>
                </svg>
                <span class="text-[10px] font-bold text-amber-500">Cómo Llegar</span>
            </a>
        </div>
    </div>
</div>

<script>
    function scrollToDockTarget(targetId) {
        const target = document.getElementById(targetId) || document.querySelector(`#${targetId}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
</script>
